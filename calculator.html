<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคิดเลข Bootstrap</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .calc-card {
            max-width: 350px;
            width: 100%;
        }
        .display {
            background: #f8f9fa;
            font-size: 2rem;
            font-weight: bold;
            text-align: right;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            min-height: 70px;
            word-wrap: break-word;
        }
        .btn-calc {
            height: 60px;
            font-size: 1.3rem;
            font-weight: bold;
        }
                .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            color: #333;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
        }
    </style>
</head>
<body>
    <a href="index.html" class="btn-back">← กลับหน้าแรก</a>
    <div class="container">
        <div class="card calc-card shadow-lg">
            <div class="card-body p-4">
                <h3 class="text-center mb-3 text-primary">🧮 เครื่องคิดเลข</h3>
                
                <!-- จอแสดงผล -->
                <div class="display" id="display">0</div>
                
                <!-- ปุ่ม -->
                <div class="row g-2">
                    <div class="col-3"><button class="btn btn-danger w-100 btn-calc" onclick="clearAll()">C</button></div>
                    <div class="col-3"><button class="btn btn-warning w-100 btn-calc" onclick="appendOp('/')">÷</button></div>
                    <div class="col-3"><button class="btn btn-warning w-100 btn-calc" onclick="appendOp('*')">×</button></div>
                    <div class="col-3"><button class="btn btn-secondary w-100 btn-calc" onclick="deleteLast()">⌫</button></div>
                    
                    <div class="col-3"><button class="btn btn-light w-100 btn-calc" onclick="appendNum('7')">7</button></div>
                    <div class="col-3"><button class="btn btn-light w-100 btn-calc" onclick="appendNum('8')">8</button></div>
                    <div class="col-3"><button class="btn btn-light w-100 btn-calc" onclick="appendNum('9')">9</button></div>
                    <div class="col-3"><button class="btn btn-warning w-100 btn-calc" onclick="appendOp('-')">-</button></div>
                    
                    <div class="col-3"><button class="btn btn-light w-100 btn-calc" onclick="appendNum('4')">4</button></div>
                    <div class="col-3"><button class="btn btn-light w-100 btn-calc" onclick="appendNum('5')">5</button></div>
                    <div class="col-3"><button class="btn btn-light w-100 btn-calc" onclick="appendNum('6')">6</button></div>
                    <div class="col-3"><button class="btn btn-warning w-100 btn-calc" onclick="appendOp('+')">+</button></div>
                    
                    <div class="col-3"><button class="btn btn-light w-100 btn-calc" onclick="appendNum('1')">1</button></div>
                    <div class="col-3"><button class="btn btn-light w-100 btn-calc" onclick="appendNum('2')">2</button></div>
                    <div class="col-3"><button class="btn btn-light w-100 btn-calc" onclick="appendNum('3')">3</button></div>
                    <div class="col-3"><button class="btn btn-warning w-100 btn-calc" onclick="appendOp('.')">.</button></div>
                    
                    <div class="col-6"><button class="btn btn-light w-100 btn-calc" onclick="appendNum('0')">0</button></div>
                    <div class="col-6"><button class="btn btn-success w-100 btn-calc" onclick="calculate()">=</button></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let current = '0';
        let shouldReset = false;
        const display = document.getElementById('display');

        function updateDisplay() {
            display.textContent = current;
        }

        function appendNum(num) {
            if (shouldReset) {
                current = num;
                shouldReset = false;
            } else {
                current = current === '0' ? num : current + num;
            }
            updateDisplay();
        }

        function appendOp(op) {
            const lastChar = current.slice(-1);
            if ('+-*/'.includes(lastChar)) {
                current = current.slice(0, -1) + op;
            } else {
                current += op;
            }
            shouldReset = false;
            updateDisplay();
        }

        function clearAll() {
            current = '0';
            updateDisplay();
        }

        function deleteLast() {
            current = current.length > 1 ? current.slice(0, -1) : '0';
            updateDisplay();
        }

        function calculate() {
            try {
                current = eval(current).toString();
                shouldReset = true;
            } catch {
                current = 'Error';
                shouldReset = true;
            }
            updateDisplay();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNum(e.key);
            if (e.key === '.') appendOp('.');
            if ('+-*/'.includes(e.key)) appendOp(e.key);
            if (e.key === 'Enter' || e.key === '=') calculate();
            if (e.key === 'Escape') clearAll();
            if (e.key === 'Backspace') deleteLast();
        });
    </script>
</body>
</html>
