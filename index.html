<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Apps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .menu-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .menu-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .menu-subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .app-btn {
            display: block;
            width: 100%;
            padding: 20px;
            margin-bottom: 15px;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
            transition: all 0.3s;
        }
        .app-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .btn-calc { background: linear-gradient(135deg, #667eea, #764ba2); }
        .btn-todo { background: linear-gradient(135deg, #48bb78, #38a169); }
        .btn-current { background: linear-gradient(135deg, #ed8936, #dd6b20); }
        .btn-stock { background: linear-gradient(135deg, #e53e3e, #c53030); }
		.btn-cardg { background: linear-gradient(135deg, #3E7510, #7BDE28); }
    </style>
</head>
<body>
    <div class="menu-card">
        <div class="menu-title">🚀 My Web Apps</div>
        <div class="menu-subtitle">เลือกแอพที่ต้องการใช้งาน</div>

		<a href="weekly_stock.html" class="app-btn btn-stock">
		    💹 Earning Calender<br>
    		<small style="font-size: 0.9rem; opacity: 0.9;">ดูผลหุันอเมริกา</small>
		</a>
		
        <a href="currency.html" class="app-btn btn-current">
		    💱 Currency Converter<br>
    		<small style="font-size: 0.9rem; opacity: 0.9;">แปลงสกุลเงิน</small>
		</a>
		
        <a href="snake.html" class="app-btn btn-todo">
            🐍 SNAKE GAME<br>
            <small style="font-size: 0.9rem; opacity: 0.9;">เกมงู</small>
        </a>
        
        <a href="arkaneon.html" class="app-btn btn-calc">
             💥 Neon Arkanoid<br>
            <small style="font-size: 0.9rem; opacity: 0.9;">เกมยิงหินใส่อิฐ</small>
        </a>
                
		<a href="cardgame.html" class="app-btn btn-cardg">
             💥 Matching Card Game<br>
            <small style="font-size: 0.9rem; opacity: 0.9;">เกมจับคู่แบบกฏพิเศษ</small>
        </a>
        
        <div style="margin-top: 20px; color: #999; font-size: 0.9rem;">
            💡 รอทำแอพเพิ่มเติม
        </div>
    </div>
</body>
</html>
