name: StockRace Fetch

on:
  schedule:
    # Runs every Monday and Thursday at 09:00 UTC
    - cron: "0 9 * * 1,4"
  workflow_dispatch: # SELF RUN

jobs:
  fetch-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run racefetch.py
        run: python topstock/racefetch.py

      - name: Commit and push updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add racingstock.csv
          git commit -m "Update racingstock.csv [skip ci]" || echo "No changes to commit"
          git push
