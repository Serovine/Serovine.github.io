name: Daily Auto Lotto Checker

on:
  schedule:
    - cron: '45 13,14 * * 1-5'
  
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  check-lotto:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Requirements
        run: pip install pandas yfinance pytz

      - name: 🚀 Run Auto Lotto Checker
        run: python auto_lotto_checker.py

      - name: 💾 Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add earnings_board.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update %Today results" && git push)
