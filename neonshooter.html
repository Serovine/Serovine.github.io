<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON ASSAULT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{--cy:#00ffff;--pk:#ff00ff;--ye:#ffff00;--gr:#00ff88;--or:#ff6600;--re:#ff0033;--bg:#06001a;}
body{background:#020008;margin:0;padding:0;width:100vw;height:100dvh;overflow:hidden;touch-action:none;font-family:'Share Tech Mono',monospace;}
#gw{position:absolute;width:420px;height:780px;background:var(--bg);border:2px solid var(--cy);box-shadow:0 0 28px var(--cy),0 0 55px rgba(0,255,255,.12),inset 0 0 40px rgba(0,0,60,.55);overflow:hidden;user-select:none;transform-origin:top left;}
#gw::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:100;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px);}
#gw::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(0,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,255,.025) 1px,transparent 1px);background-size:40px 40px;}
/* HUD */
#hud{position:absolute;top:0;left:0;right:0;height:52px;background:rgba(0,0,20,.93);border-bottom:1px solid rgba(0,255,255,.22);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:10;}
.hb{display:flex;flex-direction:column;align-items:center;gap:1px;}
.hl{font-size:8px;color:rgba(0,255,255,.42);letter-spacing:2px;font-family:'Orbitron',monospace;}
.hv{font-size:16px;font-family:'Orbitron',monospace;font-weight:700;color:var(--cy);text-shadow:0 0 9px var(--cy);}
.hv.st{color:var(--pk);text-shadow:0 0 9px var(--pk);}
.hv.bm{color:var(--or);text-shadow:0 0 9px var(--or);}
#puHud{position:absolute;top:53px;left:0;right:0;height:18px;z-index:10;display:flex;align-items:center;justify-content:center;font-size:8px;font-family:'Orbitron',monospace;letter-spacing:1px;color:rgba(0,255,255,.32);background:rgba(0,0,14,.72);border-bottom:1px solid rgba(0,255,255,.09);}
#gc{position:absolute;top:71px;left:0;right:0;bottom:118px;z-index:1;}
canvas{display:block;width:100%;height:100%;}
/* Progress — no number */
#prog{position:absolute;bottom:114px;left:0;right:0;height:18px;padding:0 10px;display:flex;align-items:center;gap:8px;z-index:10;background:rgba(0,0,14,.55);}
.pl{font-size:7px;color:rgba(0,255,255,.38);font-family:'Orbitron',monospace;white-space:nowrap;}
#pbo{flex:1;height:7px;background:rgba(0,255,255,.07);border:1px solid rgba(0,255,255,.22);border-radius:4px;overflow:hidden;}
#pbi{height:100%;background:linear-gradient(90deg,var(--cy),var(--pk));box-shadow:0 0 7px var(--cy);border-radius:4px;width:0%;transition:width .12s;}
/* Controls */
#ctrl{position:absolute;bottom:0;left:0;right:0;height:110px;background:rgba(0,0,18,.96);border-top:1px solid rgba(0,255,255,.15);display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:6px;z-index:10;}
#arrowPad{display:flex;gap:5px;height:88px;}
.abtn{width:72px;height:88px;background:rgba(0,255,255,.04);border:2px solid rgba(0,255,255,.22);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .08s;-webkit-tap-highlight-color:transparent;touch-action:none;position:relative;overflow:hidden;}
.abtn.left::after{content:'';position:absolute;width:0;height:0;border-style:solid;border-width:20px 24px 20px 0;border-color:transparent rgba(0,255,255,.4) transparent transparent;}
.abtn.right::after{content:'';position:absolute;width:0;height:0;border-style:solid;border-width:20px 0 20px 24px;border-color:transparent transparent transparent rgba(0,255,255,.4);}
.abtn-lbl{position:absolute;bottom:7px;font-size:7px;color:rgba(0,255,255,.35);font-family:'Orbitron',monospace;letter-spacing:1px;}
.abtn.pressed,.abtn:active{background:rgba(0,255,255,.13);border-color:var(--cy);box-shadow:0 0 18px var(--cy);transform:scale(.93);}
.abtn.left.pressed::after,.abtn.left:active::after{border-color:transparent var(--cy) transparent transparent;}
.abtn.right.pressed::after,.abtn.right:active::after{border-color:transparent transparent transparent var(--cy);}
#actionPad{display:flex;gap:8px;align-items:center;}
.acbtn{width:80px;height:80px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none;transition:all .08s;}
#btnBomb{background:radial-gradient(circle at 42% 38%,rgba(255,102,0,.18),rgba(255,40,0,.05));border:2.5px solid rgba(255,102,0,.55);box-shadow:0 0 14px rgba(255,102,0,.28);}
#btnBomb .ic{font-size:28px;line-height:1;}
#btnBomb .lb{font-size:7px;font-family:'Orbitron',monospace;color:rgba(255,102,0,.65);letter-spacing:1px;}
#btnBomb.pressed,#btnBomb:active{background:radial-gradient(circle at 42% 38%,rgba(255,102,0,.32),rgba(255,40,0,.13));border-color:var(--or);box-shadow:0 0 26px var(--or);transform:scale(.91);}
#btnFire{background:radial-gradient(circle at 42% 38%,rgba(255,0,255,.14),rgba(160,0,255,.04));border:2.5px solid rgba(255,0,255,.42);box-shadow:0 0 10px rgba(255,0,255,.18);}
#btnFire .ic{font-size:28px;line-height:1;}
#btnFire .lb{font-size:7px;font-family:'Orbitron',monospace;color:rgba(255,0,255,.6);letter-spacing:1px;}
#btnFire.pressed,#btnFire:active{background:radial-gradient(circle at 42% 38%,rgba(255,0,255,.28),rgba(160,0,255,.12));border-color:var(--pk);box-shadow:0 0 22px var(--pk);transform:scale(.91);}
/* Overlays */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;background:rgba(0,0,10,.91);gap:11px;}
.ov-t{font-family:'Orbitron',monospace;font-weight:900;font-size:32px;letter-spacing:4px;text-align:center;line-height:1.2;}
.cy-t{color:var(--cy);text-shadow:0 0 20px var(--cy),0 0 45px var(--cy);}
.pk-t{color:var(--pk);text-shadow:0 0 20px var(--pk),0 0 45px var(--pk);}
.gr-t{color:var(--gr);text-shadow:0 0 20px var(--gr);animation:pls .6s infinite alternate;}
@keyframes pls{from{opacity:.55}to{opacity:1}}
.ov-sub{font-size:9px;color:rgba(255,255,255,.3);letter-spacing:2px;font-family:'Orbitron',monospace;text-align:center;}
.ov-st{font-size:12px;color:rgba(255,255,255,.52);font-family:'Share Tech Mono',monospace;}
.ov-st span{color:var(--cy);}
/* keyboard guide box */
#kbGuide{margin-top:4px;border:1px solid rgba(0,255,255,.2);border-radius:6px;padding:8px 16px;background:rgba(0,255,255,.04);display:grid;grid-template-columns:auto auto;gap:3px 12px;align-items:center;}
.kg-key{font-size:9px;color:var(--cy);font-family:'Orbitron',monospace;letter-spacing:1px;text-align:right;}
.kg-val{font-size:9px;color:rgba(255,255,255,.45);font-family:'Share Tech Mono',monospace;}
.ov-btn{margin-top:4px;padding:10px 26px;background:transparent;border:2px solid var(--cy);color:var(--cy);font-family:'Orbitron',monospace;font-size:12px;font-weight:700;letter-spacing:3px;cursor:pointer;border-radius:6px;box-shadow:0 0 12px var(--cy);transition:all .2s;}
.ov-btn:hover{background:rgba(0,255,255,.1);box-shadow:0 0 22px var(--cy);}
.ov-btn.g{border-color:var(--gr);color:var(--gr);box-shadow:0 0 12px var(--gr);}
.ov-btn.g:hover{background:rgba(0,255,136,.1);}
.ov-btn.p{border-color:var(--pk);color:var(--pk);box-shadow:0 0 12px var(--pk);}
.ov-btn.p:hover{background:rgba(255,0,255,.1);}
#flashOv{position:absolute;inset:0;pointer-events:none;z-index:90;opacity:0;background:white;transition:opacity .05s;}
#dmgOv{position:absolute;inset:0;pointer-events:none;z-index:89;opacity:0;border:5px solid var(--re);box-shadow:inset 0 0 35px rgba(255,0,51,.35);}
.hidden{display:none!important;}
</style>
</head>
<body>
<div id="gw">
  <div id="hud">
    <div class="hb"><div class="hl">SCORE</div><div class="hv" id="sVal">0</div></div>
    <div class="hb"><div class="hl">STAGE</div><div class="hv st" id="stVal">1</div></div>
    <div class="hb"><div class="hl">BOMBS</div><div class="hv bm" id="bVal">3</div></div>
  </div>
  <div id="puHud">⚡ READY</div>
  <div id="gc"><canvas id="cv"></canvas>
    <!-- Goal GIF overlay — positioned by JS -->
    <img id="goalImg" src="https://raw.githubusercontent.com/Serovine/Serovine.github.io/refs/heads/main/assets/neon_debi.gif"
      style="position:absolute;top:0;left:0;image-rendering:pixelated;pointer-events:none;display:none;">
  </div>
  <div id="prog">
    <div class="pl">TARGET</div>
    <div id="pbo"><div id="pbi"></div></div>
  </div>
  <div id="ctrl">
    <div id="arrowPad">
      <div class="abtn left" id="btnL"><div class="abtn-lbl">LEFT</div></div>
      <div class="abtn right" id="btnR"><div class="abtn-lbl">RIGHT</div></div>
    </div>
    <div id="actionPad">
      <div class="acbtn" id="btnBomb"><div class="ic">💥</div><div class="lb">BOMB</div></div>
      <div class="acbtn" id="btnFire"><div class="ic">🔫</div><div class="lb">FIRE</div></div>
    </div>
  </div>
  <div id="flashOv"></div>
  <div id="dmgOv"></div>

  <!-- START SCREEN -->
  <div class="ov" id="scrStart">
    <div class="ov-t cy-t">NEON<br>ASSAULT</div>
    <div class="ov-sub">DESTROY · SURVIVE · ASCEND</div>
    <div id="kbGuide">
      <div class="kg-key">← →</div><div class="kg-val">Move Turret</div>
      <div class="kg-key">SPACE</div><div class="kg-val">Shot</div>
      <div class="kg-key">X</div><div class="kg-val">Beam Cannon</div>
      <div class="kg-key">⚠</div><div class="kg-val">Don't let the blocks fall to base!</div>
    </div>
    <button class="ov-btn" id="btnStart">▶ START GAME</button>
  </div>
  <div class="ov hidden" id="scrClear">
    <div class="ov-t gr-t">STAGE CLEAR!</div>
    <div class="ov-st">TOTAL SCORE: <span id="cScore">0</span></div>
    <div class="ov-st">STAGE <span id="cStage">1</span> COMPLETE</div>
    <div class="ov-st">BOMBS LEFT: <span id="cBombs">3</span></div>
    <button class="ov-btn g" id="btnNext">▶ NEXT STAGE</button>
  </div>
  <div class="ov hidden" id="scrOver">
    <div class="ov-t pk-t">GAME<br>OVER</div>
    <div class="ov-st">FINAL SCORE: <span id="oScore">0</span></div>
    <div class="ov-st">REACHED STAGE: <span id="oStage">1</span></div>
    <button class="ov-btn p" id="btnRestart">↺ PLAY AGAIN</button>
  </div>
</div>

<script>
// =====================================================
// NEON ASSAULT v1.3
// =====================================================
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const gcDiv=document.getElementById('gc');

function resizeCv(){cv.width=gcDiv.clientWidth;cv.height=gcDiv.clientHeight;}
resizeCv();

// Scale to viewport — absolute position, top-left origin
(function scaleGame(){
  const gw=document.getElementById('gw');
  function doScale(){
    const vw=window.innerWidth;
    const vh=window.visualViewport?window.visualViewport.height:window.innerHeight;
    const s=Math.min(vw/420,vh/780,1);
    const ox=(vw-420*s)/2;
    const oy=(vh-780*s)/2;
    gw.style.transform=`translate(${ox}px,${oy}px) scale(${s})`;
  }
  doScale();
  window.addEventListener('resize',doScale);
  if(window.visualViewport)window.visualViewport.addEventListener('resize',doScale);
})();

const COLS=8,MAR=3;
let BW,BH;
function calcBS(){BW=Math.floor((cv.width-MAR*(COLS+1))/COLS);BH=Math.floor(BW*.52);}
calcBS();

// =====================================================
// SOUND ENGINE — Web Audio API, fully synthesized
// =====================================================
const SFX=(()=>{
  let ctx=null;
  function ac(){
    if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();}
    if(ctx.state==='suspended')ctx.resume();
    return ctx;
  }
  // Generic tone helper
  function tone(freq,dur,type='square',vol=0.18,freqEnd){
    const c=ac();
    const o=c.createOscillator();
    const g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=type;o.frequency.setValueAtTime(freq,c.currentTime);
    if(freqEnd!==undefined)o.frequency.exponentialRampToValueAtTime(freqEnd,c.currentTime+dur);
    g.gain.setValueAtTime(vol,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
    o.start(c.currentTime);o.stop(c.currentTime+dur+0.01);
  }
  // Noise burst helper
  function noise(dur,vol=0.15,lpFreq=800){
    const c=ac();
    const buf=c.createBuffer(1,Math.ceil(c.sampleRate*dur),c.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=c.createBufferSource();src.buffer=buf;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=lpFreq;
    const g=c.createGain();
    src.connect(lp);lp.connect(g);g.connect(c.destination);
    g.gain.setValueAtTime(vol,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
    src.start();src.stop(c.currentTime+dur+0.01);
  }

  return{
    shoot(){tone(880,.06,'square',.12,440);},
    shootLaser(){tone(1200,.12,'sawtooth',.14,2400);},
    shootDouble(){tone(660,.07,'square',.1,330);tone(880,.07,'square',.1,440);},
    shootBounce(){tone(520,.08,'triangle',.13,780);},
    blockHit(){tone(300,.04,'square',.08,200);},
    blockBreak(){
      tone(180,.12,'sawtooth',.16,80);
      noise(.1,.12,600);
    },
    powerup(){
      // ascending arp
      const c=ac();
      [523,659,784,1047].forEach((f,i)=>{
        const o=c.createOscillator();const g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type='square';o.frequency.value=f;
        const t=c.currentTime+i*.07;
        g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(.15,t+.03);
        g.gain.exponentialRampToValueAtTime(0.001,t+.12);
        o.start(t);o.stop(t+.13);
      });
    },
    bomb(){
      // deep boom
      const c=ac();
      const o=c.createOscillator();const g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type='sawtooth';o.frequency.setValueAtTime(160,c.currentTime);
      o.frequency.exponentialRampToValueAtTime(30,c.currentTime+.4);
      g.gain.setValueAtTime(.35,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+.45);
      o.start();o.stop(c.currentTime+.46);
      noise(.3,.25,400);
    },
    goalHit(){tone(1400,.05,'sine',.1,700);},
    goalBallBounce(){tone(440,.04,'triangle',.08,880);},
    playerStun(){
      tone(200,.2,'sawtooth',.2,80);
      noise(.2,.18,300);
    },
    stageClear(){
      // fanfare
      const c=ac();
      [523,659,784,1047,1319].forEach((f,i)=>{
        const o=c.createOscillator();const g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type='square';o.frequency.value=f;
        const t=c.currentTime+i*.1;
        g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.18,t+.04);
        g.gain.exponentialRampToValueAtTime(0.001,t+.22);
        o.start(t);o.stop(t+.23);
      });
    },
    gameOver(){
      // descending downer
      const c=ac();
      [400,320,240,160,100].forEach((f,i)=>{
        const o=c.createOscillator();const g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type='sawtooth';o.frequency.value=f;
        const t=c.currentTime+i*.12;
        g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.2,t+.04);
        g.gain.exponentialRampToValueAtTime(0.001,t+.28);
        o.start(t);o.stop(t+.29);
      });
      noise(.6,.2,200);
    },
    darkfire(){
      noise(.15,.2,1200);
      tone(60,.3,'sawtooth',.12,30);
    },
    stop(){
      // slow-down whoosh
      tone(800,.25,'sine',.12,100);
    },
    accel(){
      // rising zoom
      tone(200,.2,'sawtooth',.12,1200);
    },
    rainbow(){
      // sparkle burst
      const c=ac();
      for(let i=0;i<6;i++){
        const f=400+Math.random()*1200;
        const o=c.createOscillator();const g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type='sine';o.frequency.value=f;
        const t=c.currentTime+i*.04;
        g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.1,t+.02);
        g.gain.exponentialRampToValueAtTime(0.001,t+.1);
        o.start(t);o.stop(t+.11);
      }
    },
  };
})();

// ── State ──
let G={
  score:0,progress:0,target:67,stage:1,bombs:3,
  phase:'start',
  powerup:null,
  sideGuns:false,sideGunTimer:0,
  darknessTimer:0,
  stopBlocksTimer:0,  // NEW: block-stop powerup
  accelPlayer:false,accelTimer:0, // NEW: player speed boost
  playerStunTimer:0, // NEW: stun from goal ball
  BASE_SPEED:220,
};
const BOMB_MAX=7;

// ── Formulas ──
function stageTarget(s){let b=67;for(let i=2;i<=s;i++){let t=Math.floor((i-1)/10);b+=20+t*10;}return b;}
// NEW speed formula: +2/stage, +4 milestone every 5
function stageSpeed(s){return Math.min(18+(s-1)*2+Math.floor((s-1)/5)*4,80);}
function stageDensity(s){
  if(s<=3)return{mn:3,mx:5,fc:.05};
  if(s<=7)return{mn:4,mx:6,fc:.15};
  if(s<=12)return{mn:5,mx:7,fc:.25};
  return{mn:6,mx:8,fc:.4};
}

// ── Colours ──
const NEONS=['#00ffff','#ff00ff','#ffff00','#00ff88','#ff6600','#ff0088','#88ff00','#00aaff','#ff4400','#cc00ff'];
function rndNeon(){return NEONS[Math.floor(Math.random()*NEONS.length)];}

// ── Block defs ── added pu_stop, pu_accel
const BT={
  normal:    {hp:1,sc:1,label:''},
  shield:    {hp:3,sc:2,label:'🛡',special:'shield'},
  iron:      {hp:5,sc:3,label:'⛓',special:'iron',wide:true},
  swell:     {hp:1,sc:1,label:'💊',special:'swell'},
  darkfire:  {hp:1,sc:1,label:'🕯',special:'darkfire'},
  repair:    {hp:1,sc:1,label:'➕',special:'repair'},
  pu_bomb:   {hp:1,sc:1,label:'💣',pu:'bomb'},
  pu_double: {hp:1,sc:1,label:'✌',pu:'double'},
  pu_chain:  {hp:1,sc:1,label:'〜',pu:'chain'},
  pu_triple: {hp:1,sc:1,label:'≡',pu:'triple'},
  pu_laser:  {hp:1,sc:1,label:'⚡',pu:'laser'},
  pu_rainbow:{hp:1,sc:1,label:'★',pu:'rainbow'},
  pu_stop:   {hp:1,sc:1,label:'⏸',pu:'stop'},
  pu_accel:  {hp:1,sc:1,label:'⚡⚡',pu:'accel'},
};

// ── Goal image element (GIF animates in DOM, not canvas) ──
const goalImgEl=document.getElementById('goalImg');
const GOAL_NORMAL_SRC='https://raw.githubusercontent.com/Serovine/Serovine.github.io/refs/heads/main/assets/neon_debi.gif';
const GOAL_HURT_SRC='https://raw.githubusercontent.com/Serovine/Serovine.github.io/refs/heads/main/assets/neon_debi_hurt.gif';

// ── Entities ──
let player={x:0,y:0,w:60,h:26};
let bullets=[],blocks=[],particles=[],floats=[];

// Goal setup — w=2*BW, h=3*BH approx (set after calcBS in initStage)
let goal={x:0,y:14,w:0,h:0,dir:1,speed:90,hitTimer:0,flickerTimer:0};

// Side guns — auto-moving, opposing directions
let sideGun1={x:0,y:0,dir:1,speed:110};
let sideGun2={x:0,y:0,dir:-1,speed:110};
let sideFireTimer=0;
const SIDE_FIRE_RATE=0.22;

// Goal ball (for stages divisible by 3)
let goalBall=null;
// goalBall = {x,y,vx,vy,timer,r}

let K={left:false,right:false,fire:false};
let fireTimer=0;
const FIRE_RATE=0.16;
let spawnTimer=0,spawnInterval=1.2;
let rainbowTimer=0;
let darkFlicker=0;
let bombBeam=null,bombBeamT=0;

// ── Helpers ──
function spawnParts(x,y,color,n=8){
  for(let i=0;i<n;i++){
    let a=Math.random()*Math.PI*2,sp=60+Math.random()*130,life=.4+Math.random()*.4;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life,ml:life,color,r:1.5+Math.random()*2.5});
  }
}
function flash(col,dur=80){const e=document.getElementById('flashOv');e.style.background=col;e.style.opacity='.55';setTimeout(()=>e.style.opacity='0',dur);}
function dmgFlash(){const e=document.getElementById('dmgOv');e.style.opacity='1';setTimeout(()=>e.style.opacity='0',200);}
function floatText(txt,color,x,y){x=x??cv.width/2;y=y??cv.height*.44;floats.push({txt,color,x,y,life:1.1,vy:-52});}
function roundRect(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}

// ── Block factory ──
function blockColor(type){
  const map={shield:'#8899ff',iron:'#aabbcc',swell:'#ff66cc',darkfire:'#2a4422',repair:'#ff3333',
    pu_bomb:'#ff6600',pu_double:'#ffee00',pu_chain:'#00ff88',pu_triple:'#ff00ff',
    pu_laser:'#ff0066',pu_rainbow:'#ffffff',pu_stop:'#00ccff',pu_accel:'#ffcc00'};
  return map[type]||rndNeon();
}
function makeBlock(col,yPos,type){
  return{x:MAR+col*(BW+MAR),y:yPos,w:BT[type].wide?BW*2:BW,h:BH,
    type,col,hp:BT[type].hp,maxHp:BT[type].hp,
    color:blockColor(type),rainbowHue:Math.random()*360,hitFlash:0};
}
function pickType(){
  const s=G.stage,roll=Math.random();
  const puC=Math.min(.08+s*.01,.18),badC=Math.min(.04+s*.015,.25);
  if(roll<puC){
    const p=['pu_bomb','pu_double','pu_chain','pu_triple','pu_laser','pu_rainbow','pu_stop','pu_accel'];
    return p[Math.floor(Math.random()*p.length)];
  }
  if(roll<puC+badC){
    const b=s>=4?['shield','iron','swell','darkfire','repair']:['shield','swell'];
    return b[Math.floor(Math.random()*b.length)];
  }
  return 'normal';
}
function spawnRow(yPos){
  const d=stageDensity(G.stage);
  let count=d.mn+Math.floor(Math.random()*(d.mx-d.mn+1));
  if(Math.random()<d.fc)count=8;
  let cols=[];
  while(cols.length<count){let c=Math.floor(Math.random()*COLS);if(!cols.includes(c))cols.push(c);}
  for(let col of cols)blocks.push(makeBlock(col,yPos,pickType()));
}

// ── Score ──
function addPts(pts){
  if(G.phase!=='playing')return false;
  G.score+=pts;G.progress+=pts;
  updateHUD();
  return checkClear();
}
function checkClear(){
  if(G.phase!=='playing')return false;
  if(G.progress>=G.target){
    G.phase='clearing';
    for(let b of blocks)spawnParts(b.x+b.w/2,b.y+b.h/2,b.color,5);
    blocks=[];bullets=[];
    flash('#00ff88',200);SFX.stageClear();
    setTimeout(showClear,600);
    return true;
  }
  return false;
}

// ── HUD ──
function updateHUD(){
  document.getElementById('sVal').textContent=G.score;
  document.getElementById('stVal').textContent=G.stage;
  document.getElementById('bVal').textContent=G.bombs;
  document.getElementById('pbi').style.width=(Math.min(G.progress/G.target,1)*100)+'%';
}
function updatePUHud(){
  const el=document.getElementById('puHud');
  let txt='',col='rgba(0,255,255,.32)';
  if(G.powerup){
    const nm={double:'✌ DOUBLE',chain:'〜 CHAIN',triple:'≡ TRIPLE',laser:'⚡ LASER'};
    txt+=(nm[G.powerup.type]||G.powerup.type.toUpperCase())+' ×'+G.powerup.shotsLeft;col='#ffff00';
  }
  if(G.sideGuns)  {txt+=(txt?'  ':'')+'🔫 SIDE '+Math.ceil(G.sideGunTimer)+'s';col='#ffff00';}
  if(G.stopBlocksTimer>0){txt+=(txt?'  ':'')+'⏸ STOP '+G.stopBlocksTimer.toFixed(1)+'s';col='#00ccff';}
  if(G.accelPlayer){txt+=(txt?'  ':'')+'💨 ACCEL '+G.accelTimer.toFixed(1)+'s';col='#ffcc00';}
  if(G.playerStunTimer>0){txt='⚡ STUNNED '+G.playerStunTimer.toFixed(1)+'s';col='#ff0033';}
  el.textContent=txt||'⚡ READY';el.style.color=col;
}

// ── Powerups ──
function applyPU(type){
  if(type==='bomb'){G.bombs=Math.min(G.bombs+1,BOMB_MAX);updateHUD();SFX.powerup();floatText('+1 BOMB','#ff6600');return;}
  if(type==='rainbow'){SFX.rainbow();activateRainbow();return;}
  if(type==='stop'){G.stopBlocksTimer=3;SFX.stop();floatText('SLOW DOWN! 3s','#00ccff');updatePUHud();return;}
  if(type==='accel'){G.accelPlayer=true;G.accelTimer=5;SFX.accel();floatText('SPEED BOOST! 5s','#ffcc00');updatePUHud();return;}
  const shots={double:30,chain:20,triple:20,laser:10};
  G.powerup={type,shotsLeft:shots[type]||10};
  SFX.powerup();
  updatePUHud();
  const nm={double:'DOUBLE SHOT!',chain:'CHAIN SHOT!',triple:'TRIPLE SHOT!',laser:'LASER MODE!'};
  floatText(nm[type]||type.toUpperCase()+'!','#ffff00');
}
function activateRainbow(){
  rainbowTimer=1.3;
  for(let b of blocks)b.rainbowHue=Math.random()*360;
  floatText('RAINBOW!','#ffffff');
  setTimeout(()=>{
    if(G.phase!=='playing'&&G.phase!=='clearing')return;
    G.sideGuns=true;G.sideGunTimer=20;
    // reset side gun positions
    sideGun1.x=player.x-30;sideGun1.y=player.y;sideGun1.dir=1;
    sideGun2.x=player.x+player.w+10;sideGun2.y=player.y;sideGun2.dir=-1;
    for(let b of blocks)b.color=rndNeon();
    updatePUHud();floatText('SIDE GUNS 20s!','#ffffff');
  },1400);
}

// ── Bullets ──
function mkBullet(x,y,angle,type='normal',pierce=false){
  const spd=620;
  const colMap={normal:'#ff00ff',bounce:'#00ff88',laser:'#ff0066'};
  bullets.push({x,y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,
    type,pierce,w:type==='laser'?7:4,h:type==='laser'?22:10,
    color:colMap[type]||'#ff00ff',bounces:type==='bounce'?2:0});
}
function firePrimary(){
  if(G.phase!=='playing'||G.playerStunTimer>0)return;
  const cx=player.x+player.w/2,cy=player.y+2;
  const pu=G.powerup;
  if(!pu||pu.shotsLeft<=0){
    mkBullet(cx,cy,-Math.PI/2);
    SFX.shoot();
    return;
  }
  switch(pu.type){
    case'double':mkBullet(cx-4,cy,-Math.PI/2);mkBullet(cx+4,cy,-Math.PI/2);SFX.shootDouble();break;
    case'chain':{const a=15*Math.PI/180;mkBullet(cx,cy,-Math.PI/2,'bounce');mkBullet(cx,cy,-Math.PI/2-a,'bounce');mkBullet(cx,cy,-Math.PI/2+a,'bounce');SFX.shootBounce();break;}
    case'triple':{const a=5*Math.PI/180;mkBullet(cx,cy,-Math.PI/2);mkBullet(cx,cy,-Math.PI/2-a);mkBullet(cx,cy,-Math.PI/2+a);SFX.shoot();break;}
    case'laser':mkBullet(cx,cy,-Math.PI/2,'laser',true);SFX.shootLaser();break;
    default:mkBullet(cx,cy,-Math.PI/2);SFX.shoot();
  }
  pu.shotsLeft--;
  if(pu.shotsLeft<=0)G.powerup=null;
  updatePUHud();
}

// ── Side guns independent update ──
function updateSideGuns(dt){
  if(!G.sideGuns)return;
  // Move in opposing directions, bounce off walls
  sideGun1.x+=sideGun1.dir*sideGun1.speed*dt;
  sideGun2.x+=sideGun2.dir*sideGun2.speed*dt;
  const GW=14; // mini gun width
  if(sideGun1.x<0){sideGun1.x=0;sideGun1.dir=1;}
  if(sideGun1.x+GW>cv.width){sideGun1.x=cv.width-GW;sideGun1.dir=-1;}
  if(sideGun2.x<0){sideGun2.x=0;sideGun2.dir=1;}
  if(sideGun2.x+GW>cv.width){sideGun2.x=cv.width-GW;sideGun2.dir=-1;}
  // Keep y aligned to player y
  sideGun1.y=player.y;
  sideGun2.y=player.y;
  // Fire periodically
  sideFireTimer-=dt;
  if(sideFireTimer<=0){
    sideFireTimer=SIDE_FIRE_RATE;
    mkBullet(sideGun1.x+GW/2,sideGun1.y,-Math.PI/2);
    mkBullet(sideGun2.x+GW/2,sideGun2.y,-Math.PI/2);
  }
}

// ── Goal ball ──
function spawnGoalBall(){
  if(!isBossStage())return;
  const angle=-Math.PI/4+(Math.random()-.5)*Math.PI/2;
  const spd=260+G.stage*8; // faster, scales with stage
  goalBall={
    x:goal.x+goal.w/2,y:goal.y+goal.h,
    vx:Math.cos(angle)*spd,vy:Math.abs(Math.sin(angle)*spd)+60,
    timer:10,r:10,
    pulse:0 // for pulsing glow animation
  };
}
function isBossStage(){return G.stage%3===0;}
function updateGoalBall(dt){
  if(!goalBall)return;
  goalBall.timer-=dt;
  if(goalBall.timer<=0){goalBall=null;setTimeout(()=>{if(G.phase==='playing')spawnGoalBall();},300);return;}
  goalBall.x+=goalBall.vx*dt;
  goalBall.y+=goalBall.vy*dt;
  // Bounce off walls
  if(goalBall.x-goalBall.r<0){goalBall.x=goalBall.r;goalBall.vx*=-1;SFX.goalBallBounce();}
  if(goalBall.x+goalBall.r>cv.width){goalBall.x=cv.width-goalBall.r;goalBall.vx*=-1;SFX.goalBallBounce();}
  if(goalBall.y-goalBall.r<0){goalBall.y=goalBall.r;goalBall.vy*=-1;SFX.goalBallBounce();}
  if(goalBall.y+goalBall.r>cv.height){goalBall.y=cv.height-goalBall.r;goalBall.vy*=-1;SFX.goalBallBounce();}
  // Hit player
  if(goalBall.y+goalBall.r>player.y&&goalBall.y-goalBall.r<player.y+player.h&&
     goalBall.x>player.x&&goalBall.x<player.x+player.w){
    G.playerStunTimer=1.5;
    goalBall=null;
    dmgFlash();SFX.playerStun();
    floatText('STUNNED!','#ff0033');
    updatePUHud();
    setTimeout(()=>{if(G.phase==='playing')spawnGoalBall();},800);
  }
}

// ── Bomb ──
function fireBomb(){
  if(G.bombs<=0||G.phase!=='playing'||G.playerStunTimer>0)return;
  G.bombs--;updateHUD();SFX.bomb();
  flash('white',100);
  const cx=player.x+player.w/2;
  const col=Math.floor((cx-MAR)/(BW+MAR));
  const cols=[col-1,col,col+1].filter(c=>c>=0&&c<COLS);
  let killed=0;
  for(let i=blocks.length-1;i>=0;i--){
    if(cols.includes(blocks[i].col)){
      spawnParts(blocks[i].x+blocks[i].w/2,blocks[i].y+blocks[i].h/2,'#ffffff',10);
      onDestroy(blocks[i]);blocks.splice(i,1);killed++;
    }
  }
  if(killed>0&&addPts(killed))return;
  bombBeam={cols};bombBeamT=.38;
}

// ── Block events ──
function onDestroy(b){
  const bt=BT[b.type];
  if(bt.pu)applyPU(bt.pu);
  if(bt.special==='swell')doSwell(b);
  if(bt.special==='darkfire')doDarkfire();
  if(bt.special==='repair')doRepair(b);
}
function doSwell(b){for(let dy=0;dy<3;dy++)for(let dx=0;dx<3;dx++){let nc=b.col+dx;if(nc>=COLS)continue;blocks.push(makeBlock(nc,b.y-dy*(BH+MAR),'normal'));}}
function doDarkfire(){G.darknessTimer=2.8;SFX.darkfire();floatText('LIGHTS OUT!','#88ff44');}
function doRepair(b){const ry=b.y;for(let blk of blocks)if(Math.abs(blk.y-ry)<BH){blk.hp=blk.maxHp;}floatText('REPAIR!','#ff4444');}

// ── Init ──
function initPlayer(){player.x=cv.width/2-player.w/2;player.y=cv.height-player.h-4;}
function initStage(){
  blocks=[];bullets=[];particles=[];floats=[];
  bombBeam=null;bombBeamT=0;spawnTimer=0;rainbowTimer=0;darkFlicker=0;goalBall=null;
  G.target=stageTarget(G.stage);G.progress=0;G.powerup=null;
  G.sideGuns=false;G.sideGunTimer=0;G.darknessTimer=0;
  G.stopBlocksTimer=0;G.accelPlayer=false;G.accelTimer=0;G.playerStunTimer=0;
  sideFireTimer=0;
  spawnInterval=Math.max(.55,1.4-G.stage*.04);
  calcBS();
  initPlayer();
  // Goal size — boss: 2×3 blocks (rect/GIF), normal: circle diameter = BW*2
  if(isBossStage()){goal.w=BW*2+MAR;goal.h=BH*3;}
  else{goal.w=BW*2;goal.h=BW*2;} // square bounding box for circle
  goal.speed=80+G.stage*6;
  goal.x=cv.width/2-goal.w/2;goal.hitTimer=0;goal.flickerTimer=0;
  goalFace=GOAL_FACES[Math.floor(Math.random()*GOAL_FACES.length)];
  goalFaceHit=GOAL_FACES_HIT[Math.floor(Math.random()*GOAL_FACES_HIT.length)];
  // Init side gun positions
  sideGun1.x=30;sideGun1.dir=1;
  sideGun2.x=cv.width-50;sideGun2.dir=-1;
  updateHUD();updatePUHud();
  for(let i=0;i<3;i++)spawnRow(-(BH+MAR)*(3-i));
  // Boss stage: spawn goal ball after short delay
  if(isBossStage())setTimeout(()=>{if(G.phase==='playing')spawnGoalBall();},2500);
}

  G.phase='gameover';
  goalImgEl.style.display='none';

// ── DRAW ──
function drawBG(){ctx.fillStyle='#06001a';ctx.fillRect(0,0,cv.width,cv.height);}

function drawDarkfire(dt){
  if(G.darknessTimer<=0)return;
  G.darknessTimer-=dt;darkFlicker+=dt;
  const alpha=Math.min(.88,(G.darknessTimer/2.8)*.88);
  ctx.fillStyle=`rgba(0,0,0,${alpha})`;ctx.fillRect(0,0,cv.width,cv.height);
  const bands=8,bh=cv.height/bands;
  for(let i=0;i<bands;i++){
    const flick=Math.sin(darkFlicker*12+i*2.3);
    if(flick>.2){ctx.fillStyle=`rgba(0,10,5,${flick*.48})`;ctx.fillRect(0,i*bh,cv.width,bh*.5);}
  }
  ctx.strokeStyle='rgba(0,80,20,.13)';ctx.lineWidth=1;
  for(let i=0;i<cv.height;i+=4){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(cv.width,i);ctx.stroke();}
}

// Normal-stage goal faces
const GOAL_FACES=['😎','😏','🤖','👾','😤','🤨'];
const GOAL_FACES_HIT=['😖','😫','🤕','💥','😵','🤯'];
let goalFace=GOAL_FACES[0];
let goalFaceHit=GOAL_FACES_HIT[0];

function drawGoal(dt){
  // Move
  goal.x+=goal.dir*goal.speed*dt;
  if(goal.x+goal.w>cv.width){goal.x=cv.width-goal.w;goal.dir=-1;}
  if(goal.x<0){goal.x=0;goal.dir=1;}
  if(goal.hitTimer>0)goal.hitTimer-=dt;
  if(goal.flickerTimer>0)goal.flickerTimer-=dt;

  const isHit=goal.hitTimer>0;
  const flicker=isHit&&Math.floor(goal.flickerTimer*20)%2===0;

  if(isBossStage()){
    // ── Boss stage: use animated GIF ──
    const wantSrc=isHit?GOAL_HURT_SRC:GOAL_NORMAL_SRC;
    if(goalImgEl.getAttribute('data-cur')!==wantSrc){
      goalImgEl.src=wantSrc;goalImgEl.setAttribute('data-cur',wantSrc);
    }
    goalImgEl.style.display=flicker?'none':'block';
    const sx=gcDiv.clientWidth/cv.width,sy=gcDiv.clientHeight/cv.height;
    goalImgEl.style.left=(goal.x*sx)+'px';goalImgEl.style.top=(goal.y*sy)+'px';
    goalImgEl.style.width=(goal.w*sx)+'px';goalImgEl.style.height=(goal.h*sy)+'px';
    goalImgEl.style.filter=isHit
      ?'drop-shadow(0 0 8px #ff0033) drop-shadow(0 0 14px #ff0033)'
      :'drop-shadow(0 0 8px #00ffff) drop-shadow(0 0 14px #00ffff)';
  } else {
    // ── Normal stage: circle + emoji — solid, drawn above blocks ──
    goalImgEl.style.display='none';
    if(flicker)return;
    const cx=goal.x+goal.w/2, cy=goal.y+goal.h/2;
    const r=goal.w/2;
    const col=isHit?'#ff0033':'#00ffff';
    ctx.save();
    // Solid fill body
    ctx.shadowColor=col;ctx.shadowBlur=24;
    ctx.fillStyle=isHit?'#330008':'#002233';
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    // Outer ring — thick bright
    ctx.strokeStyle=col;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
    // Inner ring decoration
    ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(cx,cy,r*.72,0,Math.PI*2);ctx.stroke();
    // Emoji face — full size
    ctx.shadowBlur=0;
    ctx.font=`${Math.round(r*1.15)}px serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(isHit?goalFaceHit:goalFace,cx,cy);
    ctx.restore();
  }
}

function drawGoalBall(){
  if(!goalBall)return;
  goalBall.pulse=(goalBall.pulse||0)+0.15;
  const r=goalBall.r;
  const px=goalBall.x,py=goalBall.y;
  ctx.save();
  // Outer pulse ring 1
  const ring1=r+6+Math.sin(goalBall.pulse)*4;
  ctx.beginPath();ctx.arc(px,py,ring1,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,0,0,0.25)';ctx.lineWidth=3;ctx.shadowColor='#ff0000';ctx.shadowBlur=20;ctx.stroke();
  // Outer pulse ring 2
  const ring2=r+12+Math.sin(goalBall.pulse+1)*5;
  ctx.beginPath();ctx.arc(px,py,ring2,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,0,80,0.12)';ctx.lineWidth=2;ctx.shadowBlur=30;ctx.stroke();
  // Main ball radial gradient
  const grd=ctx.createRadialGradient(px-r*.3,py-r*.3,r*.05,px,py,r*1.2);
  grd.addColorStop(0,'#ffffff');
  grd.addColorStop(0.15,'#ff4488');
  grd.addColorStop(0.5,'#ff0022');
  grd.addColorStop(1,'rgba(200,0,0,0)');
  ctx.beginPath();ctx.arc(px,py,r*1.2,0,Math.PI*2);
  ctx.fillStyle=grd;ctx.shadowColor='#ff0033';ctx.shadowBlur=35;ctx.fill();
  // Core bright center
  ctx.beginPath();ctx.arc(px,py,r*.45,0,Math.PI*2);
  ctx.fillStyle='#ffffff';ctx.shadowColor='#ffffff';ctx.shadowBlur=18;ctx.fill();
  // Inner hot glow
  ctx.beginPath();ctx.arc(px,py,r*.8,0,Math.PI*2);
  ctx.fillStyle='rgba(255,60,60,0.55)';ctx.shadowBlur=8;ctx.fill();
  ctx.restore();
}

function drawPlayer(){
  const{x:px,y:py,w:pw,h:ph}=player;
  const stunned=G.playerStunTimer>0;
  const col=stunned?'#ff0033':'#00ffff';
  // Flicker when stunned
  if(stunned&&Math.floor(Date.now()/80)%2===0)return;
  ctx.shadowColor=col;ctx.shadowBlur=16;
  ctx.fillStyle=stunned?'#330011':'#003344';ctx.strokeStyle=col;ctx.lineWidth=2;
  roundRect(ctx,px,py+ph*.42,pw,ph*.58,4);ctx.fill();ctx.stroke();
  ctx.fillStyle=stunned?'#440022':'#004455';ctx.strokeStyle=stunned?'#dd0022':'#00dddd';ctx.lineWidth=1.5;
  roundRect(ctx,px+pw*.12,py+8,pw*.76,ph*.52,4);ctx.fill();ctx.stroke();
  ctx.fillStyle=stunned?'#550033':'#005566';
  for(let i=0;i<5;i++)ctx.fillRect(px+4+i*(pw*.18),py+ph*.56,pw*.13,ph*.14);
  ctx.fillStyle=col;ctx.shadowBlur=10;ctx.fillRect(px+pw/2-3,py-5,6,14);
  ctx.fillStyle=stunned?'rgba(255,0,51,.9)':'rgba(0,255,255,.9)';ctx.shadowBlur=18;
  ctx.beginPath();ctx.arc(px+pw/2,py-5,4,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
}
function drawMiniGun(x,y){
  ctx.fillStyle='#332200';ctx.strokeStyle='#ffaa00';ctx.lineWidth=1.5;
  ctx.shadowColor='#ffaa00';ctx.shadowBlur=7;
  roundRect(ctx,x,y,14,16,3);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ffaa00';ctx.fillRect(x+4,y-5,4,8);ctx.shadowBlur=0;
}
function drawSideGuns(){
  if(!G.sideGuns)return;
  drawMiniGun(sideGun1.x,sideGun1.y);
  drawMiniGun(sideGun2.x,sideGun2.y);
}
function drawBlock(b){
  let color=b.color;
  if(rainbowTimer>0){b.rainbowHue=(b.rainbowHue+2)%360;color=`hsl(${b.rainbowHue},100%,58%)`;}
  if(b.hitFlash>0){color='#ffffff';b.hitFlash--;}
  else if(b.maxHp>1){const r=b.hp/b.maxHp;color=`hsl(${200*r},100%,${40+r*20}%)`;}
  ctx.shadowColor=color;ctx.shadowBlur=b.hitFlash>0?20:6;
  ctx.fillStyle=color+'28';ctx.strokeStyle=color;ctx.lineWidth=1.5;
  roundRect(ctx,b.x+1,b.y+1,b.w-2,b.h-2,3);ctx.fill();ctx.stroke();
  const lbl=BT[b.type].label;
  if(lbl){ctx.shadowBlur=0;ctx.font=`${Math.min(b.h*.5,14)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(lbl,b.x+b.w/2,b.y+b.h/2);}
  if(b.maxHp>1){for(let i=0;i<b.hp;i++){ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.65)';ctx.fillRect(b.x+3+i*5,b.y+b.h-4,4,2);}}
  ctx.shadowBlur=0;
}
function drawBullet(b){
  ctx.shadowColor=b.color;ctx.shadowBlur=13;ctx.fillStyle=b.color;
  if(b.type==='laser'){ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(b.x-1,b.y-b.h/2,2,b.h);}
  else ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);
  ctx.shadowBlur=0;
}
function drawBombBeam(){
  if(!bombBeam)return;
  const a=Math.min(1,bombBeamT*2.8);
  ctx.save();
  for(let i=0;i<bombBeam.cols.length;i++){
    const col=bombBeam.cols[i];
    const bx=MAR+col*(BW+MAR);
    const cx=bx+BW/2;

    // Outer glow (purple/blue)
    const outerW=BW+12;
    const glowGrd=ctx.createLinearGradient(cx-outerW/2,0,cx+outerW/2,0);
    glowGrd.addColorStop(0,'rgba(0,0,0,0)');
    glowGrd.addColorStop(0.15,`rgba(120,0,255,${a*.5})`);
    glowGrd.addColorStop(0.35,`rgba(0,120,255,${a*.7})`);
    glowGrd.addColorStop(0.5,`rgba(255,255,255,${a*.15})`);
    glowGrd.addColorStop(0.65,`rgba(0,120,255,${a*.7})`);
    glowGrd.addColorStop(0.85,`rgba(120,0,255,${a*.5})`);
    glowGrd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glowGrd;
    ctx.fillRect(cx-outerW/2,0,outerW,cv.height);

    // Main beam gradient: purple edge → blue → white center → blue → purple edge
    const beamGrd=ctx.createLinearGradient(bx,0,bx+BW,0);
    beamGrd.addColorStop(0,   `rgba(140,0,255,${a*.9})`);
    beamGrd.addColorStop(0.2, `rgba(0,150,255,${a})`);
    beamGrd.addColorStop(0.45,`rgba(255,255,255,${a})`);
    beamGrd.addColorStop(0.5, `rgba(255,255,255,${a})`);
    beamGrd.addColorStop(0.55,`rgba(255,255,255,${a})`);
    beamGrd.addColorStop(0.8, `rgba(0,150,255,${a})`);
    beamGrd.addColorStop(1,   `rgba(140,0,255,${a*.9})`);
    ctx.shadowColor='#ffffff';ctx.shadowBlur=30*a;
    ctx.fillStyle=beamGrd;
    ctx.fillRect(bx,0,BW,cv.height);

    // Bright white core line down the center
    const coreGrd=ctx.createLinearGradient(cx-2,0,cx+2,0);
    coreGrd.addColorStop(0,'rgba(255,255,255,0)');
    coreGrd.addColorStop(0.5,`rgba(255,255,255,${a})`);
    coreGrd.addColorStop(1,'rgba(255,255,255,0)');
    ctx.shadowColor='#ffffff';ctx.shadowBlur=20*a;
    ctx.fillStyle=coreGrd;
    ctx.fillRect(cx-2,0,4,cv.height);
  }
  ctx.restore();
}
function drawParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;p.life-=dt;
    if(p.life<=0){particles.splice(i,1);continue;}
    const a=p.life/p.ml;
    ctx.shadowColor=p.color;ctx.shadowBlur=4;
    ctx.fillStyle=p.color+Math.floor(a*255).toString(16).padStart(2,'0');
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*a,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;
}
function drawFloats(dt){
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];f.y+=f.vy*dt;f.life-=dt;
    if(f.life<=0){floats.splice(i,1);continue;}
    ctx.globalAlpha=Math.min(1,f.life);ctx.fillStyle=f.color;
    ctx.shadowColor=f.color;ctx.shadowBlur=9;
    ctx.font='bold 13px "Orbitron",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.txt,f.x,f.y);ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
}

// ── UPDATE ──
function update(dt){
  if(G.phase!=='playing')return;

  // Stun timer
  if(G.playerStunTimer>0){G.playerStunTimer=Math.max(0,G.playerStunTimer-dt);updatePUHud();}

  // Player move (blocked when stunned)
  if(G.playerStunTimer<=0){
    const spd=G.accelPlayer?400:G.BASE_SPEED;
    if(K.left)  player.x=Math.max(0,player.x-spd*dt);
    if(K.right) player.x=Math.min(cv.width-player.w,player.x+spd*dt);
  }

  // Accel timer
  if(G.accelPlayer){G.accelTimer=Math.max(0,G.accelTimer-dt);if(G.accelTimer<=0){G.accelPlayer=false;floatText('SPEED NORMAL','#ffcc00');}updatePUHud();}

  // Stop blocks timer
  if(G.stopBlocksTimer>0){G.stopBlocksTimer=Math.max(0,G.stopBlocksTimer-dt);updatePUHud();}

  // Fire
  if(K.fire&&G.playerStunTimer<=0){fireTimer-=dt;if(fireTimer<=0){firePrimary();fireTimer=FIRE_RATE;}}
  else if(G.playerStunTimer>0)fireTimer=0;
  else fireTimer=0;

  // Side guns
  if(G.sideGuns){
    G.sideGunTimer-=dt;
    if(G.sideGunTimer<=0){G.sideGuns=false;updatePUHud();floatText('SIDE GUNS GONE','#666');}
    else updateSideGuns(dt);
  }

  if(rainbowTimer>0)rainbowTimer-=dt;
  if(bombBeam){bombBeamT-=dt;if(bombBeamT<=0)bombBeam=null;}

  // Spawn rows
  spawnTimer-=dt;
  if(spawnTimer<=0){spawnTimer=spawnInterval;spawnRow(-BH-2);}

  // Move blocks (slow to stage-1 speed when stop active)
  if(G.stopBlocksTimer<=0){
    const spd=stageSpeed(G.stage);
    for(let i=blocks.length-1;i>=0;i--){
      if(G.phase!=='playing')return;
      blocks[i].y+=spd*dt;
      if(blocks[i].y+blocks[i].h>=player.y-2){dmgFlash();showOver();return;}
    }
  } else {
    const spd=stageSpeed(1); // stage-1 speed during stop
    for(let i=blocks.length-1;i>=0;i--){
      if(G.phase!=='playing')return;
      blocks[i].y+=spd*dt;
      if(blocks[i].y+blocks[i].h>=player.y-2){dmgFlash();showOver();return;}
    }
  }

  // Goal ball
  updateGoalBall(dt);

  // Bullets
  for(let i=bullets.length-1;i>=0;i--){
    if(G.phase!=='playing')return;
    const b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.bounces>0){
      if(b.x<0){b.x=0;b.vx*=-1;b.bounces--;}
      if(b.x>cv.width){b.x=cv.width;b.vx*=-1;b.bounces--;}
    }
    if(b.y<-40||b.y>cv.height+40||b.x<-60||b.x>cv.width+60){bullets.splice(i,1);continue;}

    // hit goal
    const gcx=goal.x+goal.w/2,gcy=goal.y+goal.h/2,gr=goal.w/2;
    const inGoal=isBossStage()
      ?(b.x>goal.x&&b.x<goal.x+goal.w&&b.y>goal.y&&b.y<goal.y+goal.h)
      :(Math.hypot(b.x-gcx,b.y-gcy)<gr+4);
    if(inGoal){
      goal.hitTimer=.45;goal.flickerTimer=.45;
      goalFaceHit=GOAL_FACES_HIT[Math.floor(Math.random()*GOAL_FACES_HIT.length)];
      spawnParts(b.x,b.y,'#00ffff',3);
      SFX.goalHit();
      if(addPts(1))return;
      if(!b.pierce)bullets.splice(i,1);
      continue;
    }

    // hit blocks
    let hit=false;
    for(let j=blocks.length-1;j>=0;j--){
      if(G.phase!=='playing')return;
      const blk=blocks[j];
      if(!blk)continue;
      if(b.x+b.w/2>blk.x&&b.x-b.w/2<blk.x+blk.w&&b.y+b.h/2>blk.y&&b.y-b.h/2<blk.y+blk.h){
        blk.hp--;blk.hitFlash=5;
        spawnParts(b.x,b.y,blk.color,4);
        SFX.blockHit();
        if(blk.hp<=0){
          const sc=BT[blk.type].sc;
          onDestroy(blk);
          spawnParts(blk.x+blk.w/2,blk.y+blk.h/2,blk.color,9);
          SFX.blockBreak();
          blocks.splice(j,1);
          if(addPts(sc))return;
        }
        hit=true;if(!b.pierce)break;
      }
    }
    if(hit&&!b.pierce&&bullets[i])bullets.splice(i,1);
  }
}

function draw(dt){
  drawBG();
  drawGoal(dt);
  drawGoalBall();
  for(const b of blocks)drawBlock(b);
  for(const b of bullets)drawBullet(b);
  drawBombBeam();
  drawSideGuns();
  drawPlayer();
  drawParticles(dt);
  drawFloats(dt);
  drawDarkfire(dt);
}

// ── LOOP ──
let lt=0;
function loop(ts){
  const dt=Math.min((ts-lt)/1000,.05);lt=ts;
  const active=G.phase==='playing'||G.phase==='clearing';
  if(active){if(G.phase==='playing')update(dt);draw(dt);}
  requestAnimationFrame(loop);
}

// ── CONTROLS ──
function mkBtn(id,dn,up){
  const el=document.getElementById(id);
  const d=e=>{e.preventDefault();el.classList.add('pressed');dn();};
  const u=e=>{e.preventDefault();el.classList.remove('pressed');if(up)up();};
  el.addEventListener('touchstart',d,{passive:false});
  el.addEventListener('touchend',u,{passive:false});
  el.addEventListener('touchcancel',u,{passive:false});
  el.addEventListener('mousedown',d);el.addEventListener('mouseup',u);el.addEventListener('mouseleave',u);
}
mkBtn('btnL',()=>K.left=true,()=>K.left=false);
mkBtn('btnR',()=>K.right=true,()=>K.right=false);
mkBtn('btnFire',()=>K.fire=true,()=>K.fire=false);
mkBtn('btnBomb',()=>fireBomb());

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')K.left=true;
  if(e.key==='ArrowRight'||e.key==='d')K.right=true;
  if(e.key===' '||e.key==='z'){e.preventDefault();K.fire=true;}
  if(e.key==='x'||e.key==='b')fireBomb();
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')K.left=false;
  if(e.key==='ArrowRight'||e.key==='d')K.right=false;
  if(e.key===' '||e.key==='z')K.fire=false;
});

document.getElementById('btnStart').onclick=()=>{
  document.getElementById('scrStart').classList.add('hidden');
  G.score=0;G.stage=1;G.bombs=3;G.phase='playing';initStage();
};
document.getElementById('btnNext').onclick=()=>{
  document.getElementById('scrClear').classList.add('hidden');
  G.stage++;G.phase='playing';initStage();
};
document.getElementById('btnRestart').onclick=()=>{
  document.getElementById('scrOver').classList.add('hidden');
  G.score=0;G.stage=1;G.bombs=3;G.phase='playing';initStage();
};

requestAnimationFrame(ts=>{lt=ts;loop(ts);});
</script>
