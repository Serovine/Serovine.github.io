<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>The Wanderer's Codex</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Uncial+Antiqua&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
        <style>
            :root {
                --parch: #f2e4c4;
                --parch-dark: #e8d5a8;
                --parch-deep: #cdb97a;
                --parch-shade: #d4c28e;
                --ink: #1a0f00;
                --ink-faded: #3d2810;
                --ink-mid: #6b4a28;
                --ink-light: #9a7348;
                --wood: #2a1204;
                --wood-mid: #4a2208;
                --spine: #3d1a06;
                --rust: #7a2010;
                --wax: #8b1a1a;
                --gold: #b8860b;
                --gold-lt: #d4a843;
                --gold-pale: #e8cc88;
                --sb-w: 280px;
                --serif: "Lora", Georgia, serif;
                --display: "Cinzel", serif;
                --fancy: "Uncial Antiqua", serif;
            }
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            html,
            body {
                height: 100%;
                overflow: hidden;
            }
            body {
                display: flex;
                flex-direction: column;
                background: var(--wood);
                font-family: var(--serif);
                color: var(--ink);
            }

            /* ══ HEADER ══════════════════════════════════════════ */
            #header {
                flex-shrink: 0;
                z-index: 100;
                background: var(--spine);
                border-bottom: 2px solid var(--gold);
                box-shadow: 0 3px 14px rgba(0, 0, 0, 0.6);
                padding: 0 14px;
                height: 54px;
                display: flex;
                align-items: center;
                gap: 12px;
            }

            /* sidebar toggle btn */
            #sb-toggle {
                flex-shrink: 0;
                background: none;
                border: 1px solid rgba(184, 134, 11, 0.35);
                border-radius: 4px;
                width: 34px;
                height: 34px;
                color: var(--gold-pale);
                font-size: 1rem;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition:
                    background 0.15s,
                    border-color 0.15s;
            }
            #sb-toggle:hover {
                background: rgba(184, 134, 11, 0.12);
                border-color: var(--gold);
            }

            /* title */
            .hdr-title {
                font-family: var(--fancy);
                font-size: 0.95rem;
                color: var(--gold-lt);
                text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.7);
                white-space: nowrap;
                flex-shrink: 0;
            }

            /* category dropdown */
            #cat-select-wrap {
                flex: 1;
                position: relative;
                min-width: 0;
            }
            #cat-select-wrap::after {
                content: "▾";
                position: absolute;
                right: 10px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--gold);
                pointer-events: none;
                font-size: 0.8rem;
            }
            #cat-select {
                width: 100%;
                appearance: none;
                background: rgba(0, 0, 0, 0.35);
                border: 1px solid rgba(184, 134, 11, 0.35);
                border-radius: 4px;
                padding: 6px 28px 6px 10px;
                font-family: var(--display);
                font-size: 0.68rem;
                letter-spacing: 0.06em;
                color: var(--gold-pale);
                outline: none;
                cursor: pointer;
                transition: border-color 0.2s;
            }
            #cat-select:focus {
                border-color: var(--gold);
            }
            #cat-select option {
                background: var(--spine);
                color: var(--gold-pale);
            }

            .hdr-candle {
                font-size: 0.95rem;
                flex-shrink: 0;
                animation: flicker 3.5s ease-in-out infinite;
            }
            @keyframes flicker {
                0%,
                100% {
                    opacity: 1;
                }
                48% {
                    opacity: 1;
                }
                51% {
                    opacity: 0.45;
                }
                54% {
                    opacity: 1;
                }
                82% {
                    opacity: 1;
                }
                85% {
                    opacity: 0.6;
                }
                88% {
                    opacity: 1;
                }
            }

            /* ══ BODY (sidebar + main) ══════════════════════════════ */
            #body {
                flex: 1;
                display: flex;
                overflow: hidden;
                position: relative;
            }

            /* ══ SIDEBAR ════════════════════════════════════════════ */
            #sidebar {
                width: var(--sb-w);
                flex-shrink: 0;
                display: flex;
                flex-direction: column;
                background: linear-gradient(180deg, #3a1a07 0%, #2e1305 100%);
                border-right: 2px solid rgba(184, 134, 11, 0.3);
                box-shadow: 4px 0 18px rgba(0, 0, 0, 0.5);
                overflow: hidden;
                transition:
                    width 0.22s cubic-bezier(0.4, 0, 0.2, 1),
                    transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 50;
            }
            #sidebar.hidden {
                width: 0;
            }

            /* on mobile sidebar overlays */
            @media (max-width: 600px) {
                #sidebar {
                    position: absolute;
                    top: 0;
                    left: 0;
                    bottom: 0;
                    width: var(--sb-w) !important;
                    transform: translateX(0);
                }
                #sidebar.hidden {
                    transform: translateX(-100%);
                }
                #sb-overlay {
                    display: none;
                    position: absolute;
                    inset: 0;
                    background: rgba(0, 0, 0, 0.45);
                    z-index: 40;
                }
                #sidebar:not(.hidden) ~ #sb-overlay {
                    display: block;
                }
            }

            .sb-cat-label {
                padding: 14px 14px 8px;
                font-family: var(--display);
                font-size: 0.58rem;
                letter-spacing: 0.22em;
                color: var(--gold);
                opacity: 0.55;
                border-bottom: 1px solid rgba(184, 134, 11, 0.18);
                flex-shrink: 0;
                white-space: nowrap;
                overflow: hidden;
            }

            /* entry list in sidebar */
            #sb-entry-list {
                flex: 1;
                overflow-y: auto;
                padding: 6px 0;
            }
            #sb-entry-list::-webkit-scrollbar {
                width: 3px;
            }
            #sb-entry-list::-webkit-scrollbar-thumb {
                background: rgba(184, 134, 11, 0.3);
            }

            .sb-entry {
                padding: 9px 14px;
                cursor: pointer;
                border-left: 3px solid transparent;
                transition:
                    background 0.15s,
                    border-color 0.15s;
            }
            .sb-entry:hover {
                background: rgba(184, 134, 11, 0.1);
                border-left-color: var(--gold);
            }
            .sb-entry.active {
                background: rgba(139, 26, 26, 0.3);
                border-left-color: var(--wax);
            }
            .sb-entry-title {
                font-family: var(--serif);
                font-size: 0.8rem;
                font-weight: 500;
                color: var(--gold-pale);
                line-height: 1.3;
                margin-bottom: 2px;
            }
            .sb-entry.active .sb-entry-title {
                color: var(--gold-lt);
                font-style: italic;
            }
            .sb-entry-date {
                font-family: var(--display);
                font-size: 0.55rem;
                color: rgba(184, 134, 11, 0.45);
                letter-spacing: 0.06em;
            }

            .sb-empty {
                padding: 24px 14px;
                text-align: center;
                font-family: var(--serif);
                font-style: italic;
                font-size: 0.78rem;
                color: rgba(184, 134, 11, 0.35);
                line-height: 1.7;
            }

            /* ══ MAIN PANEL ═════════════════════════════════════════ */
            #main {
                flex: 1;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                position: relative;
            }

            /* ── STATE WRAPPER ── */
            #state-wrap {
                flex: 1;
                overflow: hidden;
                position: relative;
            }
            .state-panel {
                position: absolute;
                inset: 0;
                overflow-y: auto;
                overflow-x: hidden;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s;
            }
            .state-panel.active {
                opacity: 1;
                pointer-events: all;
            }

            /* scrollbar for main */
            .state-panel::-webkit-scrollbar {
                width: 6px;
            }
            .state-panel::-webkit-scrollbar-track {
                background: rgba(0, 0, 0, 0.15);
            }
            .state-panel::-webkit-scrollbar-thumb {
                background: rgba(184, 134, 11, 0.3);
                border-radius: 3px;
            }

            /* ══ STATE 1: WELCOME ════════════════════════════════════ */
            #state-welcome {
                background: var(--wood);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .welcome-inner {
                text-align: center;
                padding: 32px 24px;
            }
            .welcome-seal {
                font-size: 3.5rem;
                filter: sepia(0.6) opacity(0.4);
                margin-bottom: 16px;
            }
            .welcome-title {
                font-family: var(--fancy);
                font-size: 1.5rem;
                color: var(--gold-pale);
                opacity: 0.6;
                margin-bottom: 10px;
            }
            .welcome-sub {
                font-family: var(--serif);
                font-style: italic;
                font-size: 0.85rem;
                color: rgba(184, 134, 11, 0.4);
                line-height: 1.8;
            }

            /* ══ STATE 2: TOC / BOOK CARDS ══════════════════════════ */
            #state-toc {
                background:
                    repeating-linear-gradient(
                        transparent 0,
                        transparent 27px,
                        rgba(139, 130, 11, 0.06) 27px,
                        rgba(139, 130, 11, 0.06) 28px
                    ),
                    var(--parch);
                padding: 28px 24px 40px;
            }
            .toc-heading {
                font-family: var(--fancy);
                font-size: 1.3rem;
                color: var(--ink);
                margin-bottom: 4px;
                padding-bottom: 10px;
                border-bottom: 2px solid var(--gold);
            }
            .toc-sub {
                font-family: var(--display);
                font-size: 0.6rem;
                letter-spacing: 0.15em;
                color: var(--ink-light);
                margin-bottom: 24px;
                margin-top: 4px;
            }
            /* left margin line */
            #state-toc {
                position: relative;
            }
            #state-toc::before {
                content: "";
                position: fixed; /* use sticky approach */
                width: 1px;
                background: rgba(122, 32, 16, 0.2);
                pointer-events: none;
            }

            .toc-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 16px;
            }

            /* Book card */
            .book-card {
                background: var(--parch-dark);
                border: 1px solid var(--parch-deep);
                border-left: 5px solid var(--wood-mid);
                border-radius: 2px 4px 4px 2px;
                padding: 16px 14px 14px;
                cursor: pointer;
                box-shadow: 2px 3px 10px rgba(0, 0, 0, 0.15);
                transition:
                    transform 0.15s,
                    box-shadow 0.15s,
                    border-left-color 0.15s;
                position: relative;
                overflow: hidden;
            }
            .book-card:hover {
                transform: translateY(-3px) rotate(0.3deg);
                box-shadow: 4px 6px 18px rgba(0, 0, 0, 0.22);
                border-left-color: var(--rust);
            }
            .book-card::after {
                content: "";
                position: absolute;
                top: 0;
                right: 0;
                width: 28px;
                height: 28px;
                background: linear-gradient(
                    225deg,
                    var(--parch-deep) 50%,
                    transparent 50%
                );
                opacity: 0.5;
            }
            .bc-icon {
                font-size: 1.5rem;
                margin-bottom: 8px;
                filter: sepia(0.4);
            }
            .bc-title {
                font-family: var(--serif);
                font-weight: 500;
                font-size: 0.88rem;
                color: var(--ink-faded);
                line-height: 1.35;
                margin-bottom: 6px;
            }
            .bc-date {
                font-family: var(--display);
                font-size: 0.56rem;
                letter-spacing: 0.08em;
                color: var(--ink-light);
                margin-bottom: 6px;
            }
            .bc-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 3px;
            }
            .bc-tag {
                font-family: var(--display);
                font-size: 0.5rem;
                border: 1px solid var(--parch-deep);
                padding: 0 4px;
                border-radius: 1px;
                color: var(--ink-light);
            }
            .bc-num {
                position: absolute;
                top: 10px;
                right: 34px;
                font-family: var(--display);
                font-size: 0.55rem;
                color: var(--ink-light);
                opacity: 0.5;
            }

            /* ══ STATE 3: CONTENT ════════════════════════════════════ */
            #state-content {
                background:
                    repeating-linear-gradient(
                        transparent 0,
                        transparent 27px,
                        rgba(139, 130, 11, 0.06) 27px,
                        rgba(139, 130, 11, 0.06) 28px
                    ),
                    var(--parch);
                padding: 28px 44px 20px 60px;
                position: relative;
            }
            /* red margin line */
            #state-content::before {
                content: "";
                position: absolute;
                left: 46px;
                top: 0;
                bottom: 0;
                width: 1px;
                background: rgba(122, 32, 16, 0.22);
                pointer-events: none;
            }

            /* ── markdown ── */
            #md-body {
                max-width: 680px;
                margin: 0 auto 0 0;
            }
            .entry-stamp {
                display: flex;
                align-items: flex-start;
                gap: 10px;
                margin-bottom: 20px;
            }
            .stamp-icon {
                font-size: 1.2rem;
                filter: sepia(0.7);
            }
            .stamp-meta {
                font-family: var(--display);
                font-size: 0.58rem;
                letter-spacing: 0.1em;
                color: var(--ink-light);
                line-height: 1.8;
            }
            .stamp-tags span {
                display: inline-block;
                border: 1px solid var(--parch-deep);
                padding: 0 4px;
                font-size: 0.52rem;
                border-radius: 1px;
                margin-right: 3px;
            }

            #md-body h1 {
                font-family: var(--fancy);
                font-size: 1.55rem;
                color: var(--ink);
                line-height: 1.2;
                margin-bottom: 6px;
                padding-bottom: 10px;
                border-bottom: 2px solid var(--gold);
            }
            #md-body h2 {
                font-family: var(--display);
                font-size: 0.92rem;
                color: var(--rust);
                margin: 26px 0 8px;
                letter-spacing: 0.07em;
            }
            #md-body h2::before {
                content: "§ ";
                opacity: 0.4;
            }
            #md-body h3 {
                font-family: var(--display);
                font-size: 0.78rem;
                color: var(--ink-faded);
                margin: 18px 0 5px;
                letter-spacing: 0.05em;
            }
            #md-body p {
                font-size: 0.87rem;
                line-height: 1.88;
                color: var(--ink-faded);
                margin-bottom: 12px;
                text-align: justify;
            }
            #md-body p:first-of-type::first-letter {
                font-family: var(--fancy);
                font-size: 2rem;
                float: left;
                line-height: 0.85;
                margin: 4px 5px 0 0;
                color: var(--rust);
            }
            #md-body a {
                color: var(--rust);
                text-decoration: underline;
                text-decoration-style: dotted;
            }
            #md-body a:hover {
                color: var(--wax);
            }
            #md-body code {
                font-size: 0.8rem;
                background: rgba(139, 130, 11, 0.07);
                border: 1px solid var(--parch-deep);
                padding: 1px 5px;
                border-radius: 2px;
                color: var(--rust);
            }
            #md-body pre {
                background: rgba(0, 0, 0, 0.04);
                border: 1px solid var(--parch-deep);
                border-left: 3px solid var(--gold);
                padding: 12px 16px;
                overflow-x: auto;
                margin: 12px 0;
            }
            #md-body pre code {
                background: none;
                border: none;
                padding: 0;
                color: var(--ink-faded);
            }
            #md-body blockquote {
                border-left: 3px solid var(--gold);
                padding: 7px 16px;
                margin: 14px 0;
                background: rgba(184, 134, 11, 0.04);
                font-style: italic;
                color: var(--ink-faded);
            }
            #md-body ul,
            #md-body ol {
                padding-left: 22px;
                margin-bottom: 12px;
            }
            #md-body li {
                font-size: 0.87rem;
                line-height: 1.75;
                color: var(--ink-faded);
                margin-bottom: 2px;
            }
            #md-body ul li::marker {
                color: var(--gold);
                content: "✦  ";
            }
            #md-body hr {
                border: none;
                text-align: center;
                margin: 22px 0;
                color: var(--gold);
                opacity: 0.4;
            }
            #md-body hr::after {
                content: "— ✦ ✦ ✦ —";
                letter-spacing: 0.3em;
                font-size: 0.7rem;
            }
            #md-body img {
                max-width: 100%;
                border: 2px solid var(--parch-deep);
                margin: 10px 0;
                box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.15);
            }
            #md-body table {
                width: 100%;
                border-collapse: collapse;
                margin: 12px 0;
                font-size: 0.82rem;
            }
            #md-body th {
                background: var(--parch-dark);
                border: 1px solid var(--parch-deep);
                padding: 6px 10px;
                font-family: var(--display);
                font-size: 0.65rem;
                color: var(--ink-faded);
                letter-spacing: 0.07em;
                text-align: left;
            }
            #md-body td {
                border: 1px solid var(--parch-deep);
                padding: 5px 10px;
                color: var(--ink-faded);
            }
            #md-body tr:nth-child(even) td {
                background: rgba(0, 0, 0, 0.02);
            }

            /* ── content nav bar ── */
            #content-nav {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                padding: 18px 0 32px;
                max-width: 680px;
                margin: 0 auto 0 0;
                border-top: 1px dashed var(--parch-deep);
                margin-top: 28px;
            }
            .nav-btn {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 8px 14px;
                cursor: pointer;
                background: var(--parch-dark);
                border: 1px solid var(--parch-deep);
                border-radius: 2px;
                font-family: var(--display);
                font-size: 0.65rem;
                letter-spacing: 0.08em;
                color: var(--ink-mid);
                transition: all 0.15s;
                text-decoration: none;
            }
            .nav-btn:hover {
                border-color: var(--gold);
                color: var(--rust);
                background: rgba(184, 134, 11, 0.06);
            }
            .nav-btn.toc-btn {
                border-color: var(--gold);
                color: var(--gold);
                background: rgba(184, 134, 11, 0.07);
            }
            .nav-btn.toc-btn:hover {
                background: rgba(184, 134, 11, 0.15);
            }
            .nav-btn:disabled,
            .nav-btn.disabled {
                opacity: 0.3;
                pointer-events: none;
            }

            /* ── loader ── */
            #loader {
                display: none;
                position: absolute;
                inset: 0;
                align-items: center;
                justify-content: center;
                background: var(--parch);
                z-index: 10;
                font-family: var(--display);
                font-size: 0.7rem;
                letter-spacing: 0.2em;
                color: var(--ink-light);
            }

            /* ══ MOBILE tweaks ══════════════════════════════════════ */
            @media (max-width: 600px) {
                #state-content {
                    padding: 20px 16px 20px 24px;
                }
                #state-content::before {
                    left: 14px;
                }
                #state-toc {
                    padding: 20px 14px 32px;
                }
                .toc-grid {
                    grid-template-columns: 1fr 1fr;
                    gap: 12px;
                }
                .hdr-title {
                    display: none;
                }
            }
            @media (max-width: 400px) {
                .toc-grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <!-- ══ HEADER ══ -->
        <div id="header">
            <button
                id="sb-toggle"
                onclick="toggleSidebar()"
                title="เปิด/ปิด sidebar"
            >
                ☰
            </button>
            <div class="hdr-title">✦ Codex</div>
            <div id="cat-select-wrap">
                <select id="cat-select" onchange="selectCat(this.value)">
                    <option value="">— เลือก Category —</option>
                </select>
            </div>
            <div class="hdr-candle">🕯</div>
        </div>

        <!-- ══ BODY ══ -->
        <div id="body">
            <!-- SIDEBAR -->
            <div id="sidebar" class="hidden">
                <div class="sb-cat-label" id="sb-label">— ENTRIES —</div>
                <div id="sb-entry-list">
                    <div class="sb-empty">
                        เลือก category<br />จาก dropdown ด้านบน
                    </div>
                </div>
            </div>
            <!-- overlay for mobile -->
            <div id="sb-overlay" onclick="toggleSidebar()"></div>

            <!-- MAIN -->
            <div id="main">
                <div id="state-wrap">
                    <!-- STATE 1: WELCOME -->
                    <div id="state-welcome" class="state-panel active">
                        <div class="welcome-inner">
                            <div class="welcome-seal">📜</div>
                            <div class="welcome-title">
                                The Wanderer's Codex
                            </div>
                            <div class="welcome-sub">
                                เลือก Category จาก dropdown ด้านบน<br />เพื่อเปิดสารบัญบันทึก
                            </div>
                        </div>
                    </div>

                    <!-- STATE 2: TOC -->
                    <div id="state-toc" class="state-panel">
                        <div class="toc-heading" id="toc-heading">—</div>
                        <div class="toc-sub" id="toc-sub">—</div>
                        <div class="toc-grid" id="toc-grid"></div>
                    </div>

                    <!-- STATE 3: CONTENT -->
                    <div id="state-content" class="state-panel">
                        <div id="loader">
                            ✦ &nbsp; กำลังเปิดหน้า... &nbsp; ✦
                        </div>
                        <div id="md-body"></div>
                        <div id="content-nav">
                            <button
                                class="nav-btn"
                                id="nav-prev"
                                onclick="navEntry(-1)"
                            >
                                ◀ ก่อนหน้า
                            </button>
                            <button class="nav-btn toc-btn" onclick="goToc()">
                                📖 สารบัญ
                            </button>
                            <button
                                class="nav-btn"
                                id="nav-next"
                                onclick="navEntry(1)"
                            >
                                ถัดไป ▶
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // ══════════════════════════════════════════════════════════════════════
            //  ✦  DATA CONFIG
            // ══════════════════════════════════════════════════════════════════════
            const CATEGORIES = [
                {
                    id: "song",
                    name: "แปลเพลง",
                    icon: "🎵",
                    type: "music",
                    desc: "แปลเนื้อเพลงเป็นภาษาไทย",
                },
                {
                    id: "novelindex",
                    name: "Novel List",
                    icon: "📚",
                    type: "novel",
                    desc: "นิยายต่างๆ",
                },
                {
                    id: "retrogame",
                    name: "Retro Game Review",
                    icon: "🕹️",
                    type: "retrogame",
                    desc: "รีวิวเกมคอนโซล retro เก่า",
                },
                {
                    id: "gameupdate",
                    name: "Gacha Game Diary",
                    icon: "⚔️",
                    type: "gachagame",
                    desc: "บันทึกการอัปเดตเกม gacha",
                },
                {
                    id: "random",
                    name: "ไร้สาระทั่วไป",
                    icon: "🍺",
                    type: "misc",
                    desc: "อื่นๆ",
                },
            ];

            // ══════════════════════════════════════════════════════════════════════
            //  ✦  โครงสร้างไฟล์ใน repo:
            //
            //  serovine.github.io/
            //  ├── tavern-diary.html
            //  └── tlog/
            //      ├── isekaihippo/
            //      │   ├── 1to50review.md
            //      │   └── 51to100review.md
            //      ├── genshin/
            //      │   ├── patch1x.md
            //      │   └── inazumajourney.md
            //      ├── translatesong/
            //      │   └── nerusongsekaiseifuku.md
            //      └── [catfolder]/
            //          └── [entryfile].md
            //
            //  รูปภาพในบทความ → tlog/[cat]/assets/img.webp
            //  ใช้ inline แทน file ได้ถ้าอยากเขียนตรงนี้เลย
            // ══════════════════════════════════════════════════════════════════════

            const ENTRIES = [
                // ── translate song ─────────────────────────────────────────────
                {
                    id: "howtosekaisefuku",
                    catId: "song",
                    title: "แปลเพลง How to Sekai Fuku ของ Neru",
                    date: "2015-12-25",
                    tags: ["translate", "song", "vocaloid"],
                    file: "tlog/translatesong/sekaiseifukubyneru.md",
                },

                // ── novel index ──────────────────────────────────────────────────
                {
                    id: "mockupnovel",
                    catId: "novelindex",
                    title: "Mockup Novel",
                    date: "2026-06-26",
                    tags: ["novel", "index"],
                    file: "tlog/novel/mockupnovel.md",
                },

                // ── Retro Game index ──────────────────────────────────────────────────
                {
                    id: "cityconnection",
                    catId: "retrogame",
                    title: "City Connection",
                    date: "2026-06-26",
                    tags: ["retro", "nes", "arcade"],
                    file: "tlog/retrogame/cityconnection.md",
                },

                // ── Online Game Update ──────────────────────────────────────────────────
                {
                    id: "zzz30",
                    catId: "gameupdate",
                    title: "Zenless Zone Zero Patch3.0 Roscalifer",
                    date: "2026-06-17",
                    tags: ["zzz", "mihoyo", "patch"],
                    file: "tlog/zzz/zzz30journey.md",
                },

                // ── random ────────────────────────────────────────────────────
                {
                    id: "guide",
                    catId: "random",
                    title: "คู่มือเพิ่มบันทึก",
                    date: "2025-06-26",
                    tags: ["meta"],
                    inline: `# คู่มือ The Wanderer's Codex ✦

## หาเลือกอ่านกันตามใจชอบเลย


---
*— The Wanderer's Codex —*`,
                },
            ];
            // ══════════════════════════════════════════════════════════════════════

            let activeCatId = null;
            let activeEntryId = null;
            let sidebarOpen = false;

            // ── populate dropdown ─────────────────────────────────────────
            (function initDropdown() {
                const sel = document.getElementById("cat-select");
                CATEGORIES.forEach((c) => {
                    const o = document.createElement("option");
                    o.value = c.id;
                    o.textContent = `${c.icon} ${c.name}`;
                    sel.appendChild(o);
                });
            })();

            // ── sidebar toggle ────────────────────────────────────────────
            function toggleSidebar() {
                sidebarOpen = !sidebarOpen;
                document
                    .getElementById("sidebar")
                    .classList.toggle("hidden", !sidebarOpen);
                document.getElementById("sb-toggle").textContent = sidebarOpen
                    ? "✕"
                    : "☰";
            }

            // ── show state ────────────────────────────────────────────────
            function showState(id) {
                document
                    .querySelectorAll(".state-panel")
                    .forEach((p) => p.classList.toggle("active", p.id === id));
                // scroll state to top
                const el = document.getElementById(id);
                if (el) el.scrollTop = 0;
            }

            // ── select category ───────────────────────────────────────────
            function selectCat(catId) {
                if (!catId) {
                    showState("state-welcome");
                    return;
                }

                activeCatId = catId;
                activeEntryId = null;

                const cat = CATEGORIES.find((c) => c.id === catId);
                const entries = ENTRIES.filter((e) => e.catId === catId);

                // ─ update sidebar
                document.getElementById("sb-label").textContent =
                    `${cat.icon} ${cat.name}`;
                buildSidebar(entries, cat);

                // ─ update TOC
                document.getElementById("toc-heading").textContent =
                    `${cat.icon} ${cat.name}`;
                document.getElementById("toc-sub").textContent =
                    `${entries.length} บันทึก · ${cat.desc}`;
                buildTocGrid(entries, cat);

                showState("state-toc");

                // auto open sidebar on desktop
                if (window.innerWidth > 600 && !sidebarOpen) toggleSidebar();
            }

            // ── build sidebar entries ─────────────────────────────────────
            function buildSidebar(entries, cat) {
                const list = document.getElementById("sb-entry-list");
                if (!entries.length) {
                    list.innerHTML =
                        '<div class="sb-empty">ยังไม่มีบันทึก</div>';
                    return;
                }
                list.innerHTML = "";
                entries.forEach((e) => {
                    const el = document.createElement("div");
                    el.className =
                        "sb-entry" + (e.id === activeEntryId ? " active" : "");
                    el.dataset.id = e.id;
                    el.innerHTML = `<div class="sb-entry-title">${e.title}</div><div class="sb-entry-date">${e.date || ""}</div>`;
                    el.onclick = () => {
                        loadEntry(e.id);
                        if (window.innerWidth <= 600) toggleSidebar();
                    };
                    list.appendChild(el);
                });
            }

            // ── build TOC grid ────────────────────────────────────────────
            function buildTocGrid(entries, cat) {
                const grid = document.getElementById("toc-grid");
                grid.innerHTML = "";
                entries.forEach((e, i) => {
                    const card = document.createElement("div");
                    card.className = "book-card";
                    card.innerHTML = `
      <div class="bc-num">${String(i + 1).padStart(2, "0")}</div>
      <div class="bc-icon">${cat.icon}</div>
      <div class="bc-title">${e.title}</div>
      <div class="bc-date">${e.date || ""}</div>
      <div class="bc-tags">${(e.tags || []).map((t) => `<span class="bc-tag">${t}</span>`).join("")}</div>`;
                    card.onclick = () => loadEntry(e.id);
                    grid.appendChild(card);
                });
            }

            // ── load entry ────────────────────────────────────────────────
            async function loadEntry(id) {
                const entry = ENTRIES.find((e) => e.id === id);
                if (!entry) return;
                activeEntryId = id;

                // highlight sidebar
                document
                    .querySelectorAll(".sb-entry")
                    .forEach((el) =>
                        el.classList.toggle("active", el.dataset.id === id),
                    );

                showState("state-content");

                const loader = document.getElementById("loader");
                const mdBody = document.getElementById("md-body");
                loader.style.display = "flex";
                mdBody.style.display = "none";

                let md = "";
                try {
                    md = entry.inline
                        ? entry.inline
                        : await (async () => {
                              const r = await fetch(entry.file);
                              if (!r.ok) throw new Error(`HTTP ${r.status}`);
                              return r.text();
                          })();
                } catch (err) {
                    md = `# ⚠ โหลดไม่ได้\n\nไม่พบ \`${entry.file}\`\n\`\`\`\n${err.message}\n\`\`\``;
                }

                loader.style.display = "none";
                mdBody.style.display = "block";

                const cat = CATEGORIES.find((c) => c.id === entry.catId);
                const tags = (entry.tags || [])
                    .map((t) => `<span>${t}</span>`)
                    .join("");
                mdBody.innerHTML = `
    <div class="entry-stamp">
      <div class="stamp-icon">${cat?.icon || "📜"}</div>
      <div class="stamp-meta">${entry.date || "—"} · ${cat?.name || ""}
        <br><div class="stamp-tags">${tags}</div>
      </div>
    </div>
    ${marked.parse(md)}`;

                document.getElementById("state-content").scrollTop = 0;
                updateNavBtns();
            }

            // ── nav prev/next ─────────────────────────────────────────────
            function updateNavBtns() {
                const catEntries = ENTRIES.filter(
                    (e) => e.catId === activeCatId,
                );
                const idx = catEntries.findIndex((e) => e.id === activeEntryId);
                document
                    .getElementById("nav-prev")
                    .classList.toggle("disabled", idx <= 0);
                document
                    .getElementById("nav-next")
                    .classList.toggle("disabled", idx >= catEntries.length - 1);
            }

            function navEntry(dir) {
                const catEntries = ENTRIES.filter(
                    (e) => e.catId === activeCatId,
                );
                const idx = catEntries.findIndex((e) => e.id === activeEntryId);
                const next = catEntries[idx + dir];
                if (next) loadEntry(next.id);
            }

            function goToc() {
                showState("state-toc");
                activeEntryId = null;
                document
                    .querySelectorAll(".sb-entry")
                    .forEach((el) => el.classList.remove("active"));
            }
        </script>
    </body>
</html>
