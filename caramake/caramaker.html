<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Maker Studio — AI Prompt Wizard</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Google Fonts: Outfit, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Glow Background Mesh -->
  <div class="ambient-glow glow-top-left"></div>
  <div class="ambient-glow glow-top-right"></div>
  <div class="ambient-glow glow-bottom-center"></div>

  <!-- APP HEADER -->
  <header id="app-header">
    <div class="header-left">
      <div class="app-logo">
        <div class="logo-icon">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>
        <div class="logo-text">
          <span class="logo-title">Character Maker <span class="badge-pro">STUDIO</span></span>
          <span class="logo-subtitle">AI Prompt Generator Wizard</span>
        </div>
      </div>
    </div>

    <div class="header-center">
      <!-- Global Quick Search Bar -->
      <div class="global-search-box" id="global-search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="global-search-input" placeholder="ค้นหาแท็กทั่วทั้งระบบ... (Ctrl + K)" autocomplete="off" spellcheck="false">
        <button class="search-clear-btn" id="search-clear-btn" title="ล้างการค้นหา"><i class="fa-solid fa-xmark"></i></button>
        <!-- Search Results Dropdown Panel -->
        <div class="search-results-dropdown hidden" id="search-results-dropdown"></div>
      </div>
    </div>

    <div class="header-right">
      <!-- Active Tag Count Badge -->
      <div class="active-count-badge" id="header-tag-count" title="จำนวนแท็กที่กำลังเลือก">
        <i class="fa-solid fa-tags"></i>
        <span id="active-tag-num">0</span>
        <span class="active-tag-label">Tags</span>
      </div>

      <!-- Presets Manager Button -->
      <button class="btn-header-action btn-presets" id="btn-open-presets" onclick="app.openPresetsModal()" title="จัดการ Preset ตัวละคร">
        <i class="fa-solid fa-bookmark"></i>
        <span>Presets</span>
      </button>

      <!-- Language Toggle Button -->
      <button id="lang-toggle" class="btn-lang" onclick="app.toggleLanguage()" title="เปลี่ยนภาษา (Change Language)">
        <i class="fa-solid fa-globe"></i>
        <span id="lang-text">TH</span>
      </button>
    </div>
  </header>

  <!-- STEP NAVIGATION TABS -->
  <nav id="section-tabs">
    <div class="tab-track"></div>
  </nav>

  <!-- ACTIVE TAGS TRAY (CHIPS) -->
  <div id="active-tags-bar"></div>

  <!-- MAIN WORKSPACE -->
  <div id="workspace">
    <!-- Submenu Tree -->
    <aside id="submenu">
      <div class="submenu-header">
        <span class="submenu-title"><i class="fa-solid fa-layer-group"></i> หมวดหมู่ย่อย</span>
      </div>
      <div class="submenu-tree-container" id="submenu-tree"></div>
    </aside>

    <!-- Content Cards Area -->
    <main id="content">
      <div class="content-loading">
        <div class="spinner"></div>
        <span>กำลังโหลดข้อมูลตัวละคร...</span>
      </div>
    </main>

    <!-- Properties Studio (Color & Pattern Inspector) -->
    <aside id="properties-panel" class="hidden"></aside>
  </div>

  <!-- FLOATING PROMPT DOCK (BOTTOM BAR) -->
  <footer id="prompt-bar">
    <div class="prompt-meta-header">
      <div class="prompt-title-tag">
        <i class="fa-solid fa-terminal"></i>
        <span>PROMPT OUTPUT</span>
      </div>
      <div class="prompt-stats">
        <span class="stat-item" id="prompt-tag-count"><i class="fa-solid fa-tag"></i> 0 Tags</span>
        <span class="stat-item" id="prompt-char-count"><i class="fa-solid fa-font"></i> 0 Chars</span>
      </div>
    </div>

    <div class="prompt-editor-row">
      <div id="prompt-text" contenteditable="true" spellcheck="false" placeholder="ยังไม่มีแท็กที่ถูกเลือก... เลือกคุณลักษณะตัวละครจากด้านบน หรือกดปุ่ม RANDOM"></div>
      
      <div id="prompt-actions">
        <button class="btn-action btn-random" onclick="app.randomize()" title="สุ่มลักษณะตัวละครแบบสุ่ม">
          <i class="fa-solid fa-dice"></i>
          <span>RANDOM</span>
        </button>
        <button class="btn-action btn-clear" onclick="app.clearAll()" title="ล้างการเลือกทั้งหมด">
          <i class="fa-solid fa-trash-can"></i>
          <span>CLEAR</span>
        </button>
        <button class="btn-action btn-copy" onclick="app.copyPrompt()" title="คัดลอก Prompt ไปยังคลิปบอร์ด">
          <i class="fa-solid fa-copy"></i>
          <span class="copy-label">COPY PROMPT</span>
        </button>
      </div>
    </div>
  </footer>

  <!-- PRESETS MODAL -->
  <div class="modal-overlay hidden" id="presets-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <i class="fa-solid fa-bookmark text-accent"></i>
          <span>Character Presets (บันทึกตัวละคร)</span>
        </div>
        <button class="modal-close-btn" onclick="app.closePresetsModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <!-- Save new preset section -->
        <div class="preset-save-section">
          <input type="text" id="preset-name-input" placeholder="ตั้งชื่อ Preset เช่น ไวฟุผมฟ้า, จอมเวทย์เอลฟ์..." maxlength="40">
          <button class="btn-save-preset" onclick="app.saveCurrentPreset()">
            <i class="fa-solid fa-floppy-disk"></i> บันทึกตัวละครปัจจุบัน
          </button>
        </div>
        <!-- Saved preset list -->
        <div class="preset-list-section">
          <div class="preset-list-header">รายการที่บันทึกไว้ (<span id="preset-count">0</span>)</div>
          <div class="preset-items-container" id="preset-items-container"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER FOR NOTIFICATIONS -->
  <div id="toast-container"></div>

  <!-- BOOTSTRAP SCRIPT -->
  <script>
  window.DROPDOWN_THRESHOLD = 12;

  Promise.all([
    fetch('data/character_db.json').then(r => r.json()),
    fetch('data/palette.json').then(r => r.json()),
    fetch('data/pattern.json').then(r => r.json())
  ]).then(([db, pal, pat]) => {
    window.PALETTES = {};
    (pal.color || []).forEach(c => { window.PALETTES[c.tag] = c.hex; });
    window.PALETTE_DATA = pal.color || [];

    window.PATTERNS = (pat.pattern || []).map(p => p.tag);
    window.PATTERN_DATA = pat.pattern || [];

    window.CHARACTER_DB = db;
    app.boot();

  }).catch(err => {
    document.body.innerHTML = `<div style="color:#f43f5e;padding:30px;font-family:sans-serif;background:#090d16;min-height:100vh;display:flex;align-items:center;justify-content:center;">
      <div style="background:#131d2e;padding:24px;border-radius:12px;border:1px solid rgba(244,63,94,0.3);box-shadow:0 8px 32px rgba(0,0,0,0.5);max-width:500px;text-align:center;">
        <div style="font-size:32px;margin-bottom:12px;">❌</div>
        <h3 style="margin-bottom:8px;color:#fff;">โหลดข้อมูลไม่สำเร็จ</h3>
        <p style="color:#94a3b8;font-size:14px;margin-bottom:16px;">${err.message}</p>
        <code style="background:#090d16;padding:8px 12px;border-radius:6px;color:#38bdf8;font-size:13px;display:inline-block;">python -m http.server 8000</code>
      </div>
    </div>`;
  });
  </script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
