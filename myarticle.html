<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SERINC // ARTICLES</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <!-- marked.js for markdown rendering -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

        <style>
            :root {
                --void: #000308;
                --deep: #060d1e;
                --navy: #0a1628;
                --panel: #0d1f3c;
                --border: #1a3a6b;
                --blue: #1565c0;
                --bright: #1976d2;
                --cyan: #00e5ff;
                --cyan-dim: #0097a7;
                --glow: #4fc3f7;
                --text: #e8f4fd;
                --text-dim: #7ab3d4;
                --text-muted: #3d6b8a;
                --mono: "Share Tech Mono", monospace;
                --body: "Inter", sans-serif;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html,
            body {
                height: 100%;
                background: var(--void);
                color: var(--text);
                font-family: var(--body);
                overflow: hidden;
            }

            /* ── STARFIELD ── */
            #starfield {
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;
            }

            /* ── LAYOUT ── */
            #app {
                position: relative;
                z-index: 1;
                display: flex;
                flex-direction: column;
                height: 100vh;
            }

            /* ── HEADER ── */
            header {
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 24px;
                height: 56px;
                background: linear-gradient(
                    90deg,
                    #000308 0%,
                    #050e20 60%,
                    #000308 100%
                );
                border-bottom: 1px solid var(--border);
                box-shadow: 0 1px 20px rgba(0, 229, 255, 0.07);
            }

            .header-logo {
                font-family: var(--mono);
                font-size: 1rem;
                letter-spacing: 0.15em;
                color: var(--cyan);
                text-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
            }
            .header-logo span {
                color: var(--text-dim);
            }

            .header-meta {
                font-family: var(--mono);
                font-size: 0.65rem;
                color: var(--text-muted);
                letter-spacing: 0.1em;
            }

            /* ── MAIN BODY ── */
            main {
                flex: 1;
                display: flex;
                overflow: hidden;
            }

            /* ── SIDEBAR ── */
            #sidebar {
                width: 280px;
                flex-shrink: 0;
                display: flex;
                flex-direction: column;
                background: linear-gradient(
                    180deg,
                    var(--deep) 0%,
                    var(--navy) 100%
                );
                border-right: 1px solid var(--border);
                overflow: hidden;
            }

            .sidebar-header {
                padding: 16px 18px 10px;
                border-bottom: 1px solid var(--border);
            }
            .sidebar-title {
                font-family: var(--mono);
                font-size: 0.65rem;
                letter-spacing: 0.2em;
                color: var(--cyan-dim);
                text-transform: uppercase;
                margin-bottom: 10px;
            }

            /* Search */
            .search-wrap {
                position: relative;
            }
            .search-wrap input {
                width: 100%;
                background: rgba(0, 0, 0, 0.4);
                border: 1px solid var(--border);
                border-radius: 4px;
                padding: 6px 10px 6px 28px;
                font-family: var(--mono);
                font-size: 0.72rem;
                color: var(--text);
                outline: none;
                transition: border-color 0.2s;
            }
            .search-wrap input::placeholder {
                color: var(--text-muted);
            }
            .search-wrap input:focus {
                border-color: var(--cyan-dim);
            }
            .search-icon {
                position: absolute;
                left: 8px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 0.75rem;
                color: var(--text-muted);
                pointer-events: none;
            }

            /* Article list */
            #article-list {
                flex: 1;
                overflow-y: auto;
                padding: 8px 0;
            }
            #article-list::-webkit-scrollbar {
                width: 4px;
            }
            #article-list::-webkit-scrollbar-track {
                background: rgba(0, 0, 0, 0.3);
            }
            #article-list::-webkit-scrollbar-thumb {
                background: var(--cyan-dim);
                border-radius: 2px;
            }
            #article-list::-webkit-scrollbar-thumb:hover {
                background: var(--cyan);
            }

            .list-group-label {
                padding: 12px 18px 4px;
                font-family: var(--mono);
                font-size: 0.58rem;
                letter-spacing: 0.25em;
                color: var(--text-muted);
                text-transform: uppercase;
            }

            .article-item {
                display: block;
                padding: 9px 18px;
                cursor: pointer;
                border-left: 3px solid transparent;
                transition:
                    background 0.15s,
                    border-color 0.15s;
                position: relative;
            }
            .article-item:hover {
                background: rgba(21, 101, 192, 0.15);
                border-left-color: var(--blue);
            }
            .article-item.active {
                background: rgba(0, 229, 255, 0.07);
                border-left-color: var(--cyan);
            }
            .article-item .ai-title {
                font-size: 0.82rem;
                font-weight: 500;
                color: var(--text);
                line-height: 1.3;
                margin-bottom: 3px;
            }
            .article-item.active .ai-title {
                color: var(--cyan);
            }
            .article-item .ai-meta {
                font-family: var(--mono);
                font-size: 0.6rem;
                color: var(--text-muted);
                display: flex;
                gap: 8px;
            }
            .ai-tag {
                display: inline-block;
                font-family: var(--mono);
                font-size: 0.55rem;
                padding: 1px 5px;
                border: 1px solid var(--border);
                border-radius: 2px;
                color: var(--text-muted);
                margin-top: 4px;
                margin-right: 3px;
            }
            .article-item.active .ai-tag {
                border-color: var(--cyan-dim);
                color: var(--cyan-dim);
            }

            /* Sidebar footer */
            .sidebar-footer {
                padding: 12px 18px;
                border-top: 1px solid var(--border);
                font-family: var(--mono);
                font-size: 0.6rem;
                color: var(--text-muted);
            }
            .add-btn {
                width: 100%;
                padding: 7px 0;
                background: transparent;
                border: 1px dashed var(--border);
                border-radius: 4px;
                color: var(--text-muted);
                font-family: var(--mono);
                font-size: 0.68rem;
                letter-spacing: 0.1em;
                cursor: pointer;
                transition: all 0.2s;
                margin-bottom: 8px;
            }
            .add-btn:hover {
                border-color: var(--cyan-dim);
                color: var(--cyan);
                background: rgba(0, 229, 255, 0.04);
            }

            /* ── CONTENT AREA ── */
            #content-area {
                flex: 1;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .content-topbar {
                padding: 10px 28px;
                border-bottom: 1px solid var(--border);
                background: rgba(6, 13, 30, 0.8);
                display: flex;
                align-items: center;
                gap: 12px;
                flex-shrink: 0;
            }
            .breadcrumb {
                font-family: var(--mono);
                font-size: 0.68rem;
                color: var(--text-muted);
            }
            .breadcrumb .bc-active {
                color: var(--cyan);
            }

            .content-scroll {
                flex: 1;
                overflow-y: auto;
                padding: 36px 48px 60px;
            }
            .content-scroll::-webkit-scrollbar {
                width: 5px;
            }
            .content-scroll::-webkit-scrollbar-track {
                background: rgba(0, 0, 0, 0.3);
            }
            .content-scroll::-webkit-scrollbar-thumb {
                background: var(--cyan-dim);
                border-radius: 3px;
            }
            .content-scroll::-webkit-scrollbar-thumb:hover {
                background: var(--cyan);
            }

            /* ── EMPTY STATE ── */
            #empty-state {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100%;
                gap: 16px;
            }
            .empty-glyph {
                font-family: var(--mono);
                font-size: 3rem;
                color: var(--border);
                text-shadow: 0 0 30px rgba(0, 229, 255, 0.15);
                line-height: 1;
            }
            .empty-title {
                font-family: var(--mono);
                font-size: 0.75rem;
                letter-spacing: 0.2em;
                color: var(--text-muted);
            }
            .empty-sub {
                font-size: 0.8rem;
                color: var(--text-muted);
                text-align: center;
                max-width: 340px;
                line-height: 1.6;
            }

            /* ── MARKDOWN STYLES ── */
            #md-body {
                max-width: 760px;
                line-height: 1.8;
            }
            #md-body h1 {
                font-family: var(--mono);
                font-size: 1.8rem;
                color: var(--cyan);
                text-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
                letter-spacing: 0.04em;
                margin-bottom: 8px;
                padding-bottom: 12px;
                border-bottom: 1px solid var(--border);
            }
            #md-body h2 {
                font-family: var(--mono);
                font-size: 1.2rem;
                color: var(--glow);
                margin: 32px 0 12px;
                padding-left: 12px;
                border-left: 3px solid var(--cyan);
            }
            #md-body h3 {
                font-family: var(--mono);
                font-size: 1rem;
                color: var(--text);
                margin: 24px 0 8px;
            }
            #md-body p {
                font-size: 0.92rem;
                color: var(--text);
                margin-bottom: 14px;
            }
            #md-body a {
                color: var(--cyan);
                text-decoration: none;
                border-bottom: 1px solid var(--cyan-dim);
                transition: color 0.2s;
            }
            #md-body a:hover {
                color: #fff;
            }
            #md-body code {
                font-family: var(--mono);
                font-size: 0.82rem;
                background: rgba(0, 229, 255, 0.06);
                border: 1px solid var(--border);
                padding: 1px 6px;
                border-radius: 3px;
                color: var(--cyan);
            }
            #md-body pre {
                background: rgba(0, 0, 0, 0.5);
                border: 1px solid var(--border);
                border-left: 3px solid var(--blue);
                border-radius: 6px;
                padding: 16px 20px;
                overflow-x: auto;
                margin: 16px 0;
            }
            #md-body pre code {
                background: none;
                border: none;
                padding: 0;
                color: var(--glow);
                font-size: 0.8rem;
            }
            #md-body blockquote {
                border-left: 3px solid var(--cyan-dim);
                padding: 8px 20px;
                margin: 16px 0;
                background: rgba(0, 229, 255, 0.03);
                color: var(--text-dim);
                font-style: italic;
            }
            #md-body ul,
            #md-body ol {
                padding-left: 24px;
                margin-bottom: 14px;
            }
            #md-body li {
                font-size: 0.92rem;
                color: var(--text);
                margin-bottom: 4px;
            }
            #md-body ul li::marker {
                color: var(--cyan-dim);
            }
            #md-body hr {
                border: none;
                border-top: 1px solid var(--border);
                margin: 32px 0;
            }
            #md-body img {
                max-width: 100%;
                border-radius: 6px;
                border: 1px solid var(--border);
                margin: 12px 0;
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            }
            #md-body table {
                width: 100%;
                border-collapse: collapse;
                margin: 16px 0;
                font-size: 0.85rem;
            }
            #md-body th {
                background: var(--panel);
                border: 1px solid var(--border);
                padding: 8px 12px;
                font-family: var(--mono);
                color: var(--cyan);
                text-align: left;
            }
            #md-body td {
                border: 1px solid var(--border);
                padding: 7px 12px;
                color: var(--text-dim);
            }
            #md-body tr:hover td {
                background: rgba(21, 101, 192, 0.1);
            }

            .article-date-stamp {
                font-family: var(--mono);
                font-size: 0.65rem;
                color: var(--text-muted);
                letter-spacing: 0.15em;
                margin-bottom: 28px;
            }

            /* ── LOADING ── */
            #loader {
                display: none;
                align-items: center;
                justify-content: center;
                height: 100%;
                gap: 10px;
            }
            .loader-dot {
                width: 6px;
                height: 6px;
                background: var(--cyan);
                border-radius: 50%;
                animation: pulse 1s ease-in-out infinite;
            }
            .loader-dot:nth-child(2) {
                animation-delay: 0.2s;
            }
            .loader-dot:nth-child(3) {
                animation-delay: 0.4s;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 0.2;
                    transform: scale(0.8);
                }
                50% {
                    opacity: 1;
                    transform: scale(1.2);
                }
            }

            /* ── MOBILE ── */
            #mobile-topbar {
                display: none;
                padding: 12px 16px;
                background: var(--deep);
                border-bottom: 1px solid var(--border);
                align-items: center;
                gap: 12px;
                flex-shrink: 0;
            }
            #mobile-select {
                flex: 1;
                background: rgba(0, 0, 0, 0.5);
                border: 1px solid var(--border);
                border-radius: 4px;
                color: var(--text);
                font-family: var(--mono);
                font-size: 0.75rem;
                padding: 6px 10px;
                outline: none;
            }
            .menu-toggle {
                background: none;
                border: 1px solid var(--border);
                color: var(--text-dim);
                padding: 6px 10px;
                font-family: var(--mono);
                font-size: 0.8rem;
                cursor: pointer;
                border-radius: 4px;
            }

            /* Scan line overlay */
            body::after {
                content: "";
                position: fixed;
                inset: 0;
                z-index: 9999;
                pointer-events: none;
                background: repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.03) 2px,
                    rgba(0, 0, 0, 0.03) 4px
                );
            }

            @media (max-width: 768px) {
                #sidebar {
                    display: none;
                }
                #mobile-topbar {
                    display: flex;
                }
                .content-scroll {
                    padding: 20px 18px 40px;
                }
            }
            /* ── NEON TEXT SELECTION ── */
            ::selection {
                background: var(--cyan);
                color: var(--void);
                text-shadow: none;
            }

            :root {
                color-scheme: dark;
            }

            ::-webkit-scrollbar {
                width: 5px;
                height: 5px;
            }

            ::-webkit-scrollbar-track {
                background: rgba(0, 0, 0, 0.3);
                border-left: 1px solid rgba(26, 58, 107, 0.2);
            }

            ::-webkit-scrollbar-thumb {
                background: var(--cyan-dim);
                border-radius: 3px;
                border: 1px solid rgba(0, 229, 255, 0.1);
            }

            ::-webkit-scrollbar-thumb:hover {
                background: var(--cyan);
                box-shadow: 0 0 10px var(--cyan); /* เรืองแสง */
            }

            ::-webkit-scrollbar-corner {
                background: transparent;
            }
        </style>
    </head>
    <body>
        <canvas id="starfield"></canvas>

        <div id="app">
            <header>
                <div class="header-logo">SERINC<span> // </span>ARTICLES</div>
                <div class="header-meta" id="clock">INITIALIZING...</div>
            </header>

            <!-- Mobile bar -->
            <div id="mobile-topbar">
                <select
                    id="mobile-select"
                    onchange="selectArticleById(this.value)"
                >
                    <option value="">— SELECT ARTICLE —</option>
                </select>
                <button class="menu-toggle" onclick="toggleSidebar()">
                    ☰
                </button>
            </div>

            <main>
                <aside id="sidebar">
                    <div class="sidebar-header">
                        <div class="sidebar-title">// ARCHIVE</div>
                        <div class="search-wrap">
                            <span class="search-icon">⌕</span>
                            <input
                                type="text"
                                id="search-input"
                                placeholder="SEARCH..."
                                oninput="filterArticles(this.value)"
                            />
                        </div>
                    </div>
                    <div id="article-list"></div>
                    <div class="sidebar-footer">
                        <div
                            id="article-count"
                            style="text-align: center"
                        ></div>
                    </div>
                </aside>

                <div id="content-area">
                    <div class="content-topbar">
                        <div class="breadcrumb">
                            <span>ARTICLES</span> /
                            <span class="bc-active" id="bc-title"
                                >SELECT FILE</span
                            >
                        </div>
                    </div>
                    <div class="content-scroll" id="content-scroll">
                        <div id="empty-state">
                            <div class="empty-glyph">✦</div>
                            <div class="empty-title">NO FILE SELECTED</div>
                            <div class="empty-sub">
                                เลือกบทความจากเมนูด้านซ้าย หรือเพิ่มบทความใหม่ใน
                                <code>ARTICLES</code> array ในไฟล์นี้
                            </div>
                        </div>
                        <div id="loader">
                            <div class="loader-dot"></div>
                            <div class="loader-dot"></div>
                            <div class="loader-dot"></div>
                        </div>
                        <div id="md-body" style="display: none"></div>
                    </div>
                </div>
            </main>
        </div>

        <script>
            // ══════════════════════════════════════════════════════════════
            //  ★  โหลดรายการบทความจาก article/articles.json
            //  ไม่ต้องแก้ไฟล์นี้เพื่อเพิ่มบทความอีกต่อไป!
            //  แก้แค่ article/articles.json ไฟล์เดียว
            // ══════════════════════════════════════════════════════════════
            let ARTICLES = [];

            let currentId = null;
            let filteredArticles = [...ARTICLES];

            // ── Build sidebar ────────────────────────────────────────────
            function buildList(list) {
                const container = document.getElementById("article-list");
                const mobileSelect = document.getElementById("mobile-select");
                container.innerHTML = "";
                mobileSelect.innerHTML =
                    '<option value="">— SELECT ARTICLE —</option>';

                // group by year
                const byYear = {};
                list.forEach((a) => {
                    const y = a.date ? a.date.slice(0, 4) : "UNDATED";
                    if (!byYear[y]) byYear[y] = [];
                    byYear[y].push(a);
                });

                Object.keys(byYear)
                    .sort((a, b) => b - a)
                    .forEach((year) => {
                        const label = document.createElement("div");
                        label.className = "list-group-label";
                        label.textContent = `— ${year}`;
                        container.appendChild(label);

                        byYear[year].forEach((a) => {
                            const el = document.createElement("div");
                            el.className =
                                "article-item" +
                                (a.id === currentId ? " active" : "");
                            el.dataset.id = a.id;
                            el.innerHTML = `
        <div class="ai-title">${a.title}</div>
        <div class="ai-meta"><span>${a.date || ""}</span></div>
        <div>${(a.tags || []).map((t) => `<span class="ai-tag">${t}</span>`).join("")}</div>
      `;
                            el.onclick = () => loadArticle(a.id);
                            container.appendChild(el);

                            const opt = document.createElement("option");
                            opt.value = a.id;
                            opt.textContent = a.title;
                            if (a.id === currentId) opt.selected = true;
                            mobileSelect.appendChild(opt);
                        });
                    });

                document.getElementById("article-count").textContent =
                    `${list.length} / ${ARTICLES.length} FILES`;
            }

            // ── Load & render ────────────────────────────────────────────
            async function loadArticle(id) {
                const art = ARTICLES.find((a) => a.id === id);
                if (!art) return;
                currentId = id;

                document.querySelectorAll(".article-item").forEach((el) => {
                    el.classList.toggle("active", el.dataset.id === id);
                });
                document.getElementById("bc-title").textContent = art.title;

                const emptyState = document.getElementById("empty-state");
                const loader = document.getElementById("loader");
                const mdBody = document.getElementById("md-body");

                emptyState.style.display = "none";
                mdBody.style.display = "none";
                loader.style.display = "flex";

                // detect type: html file, inline html, or markdown
                const isHtmlFile = art.file && art.file.match(/\.html?$/i);
                const isInlineHtml = art.inlineHtml;

                try {
                    if (isInlineHtml) {
                        // inline HTML — inject directly
                        loader.style.display = "none";
                        mdBody.style.display = "block";
                        mdBody.innerHTML = `
        <div class="article-date-stamp">✦ ${art.date || "NO DATE"} &nbsp;|&nbsp; ${(art.tags || []).join(" · ")}</div>
        ${art.inlineHtml}`;
                    } else if (isHtmlFile) {
                        // fetch .html file — inject as-is inside a scoped wrapper
                        const res = await fetch(art.file);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const html = await res.text();
                        // extract <body> content if present, else use full text
                        const bodyMatch = html.match(
                            /<body[^>]*>([\s\S]*?)<\/body>/i,
                        );
                        const content = bodyMatch ? bodyMatch[1] : html;
                        loader.style.display = "none";
                        mdBody.style.display = "block";
                        mdBody.innerHTML = `
        <div class="article-date-stamp">✦ ${art.date || "NO DATE"} &nbsp;|&nbsp; ${(art.tags || []).join(" · ")}</div>
        <div class="html-content">${content}</div>`;
                    } else {
                        // markdown (inline or file)
                        let mdText = "";
                        if (art.inline) {
                            mdText = art.inline;
                        } else {
                            const res = await fetch(art.file);
                            if (!res.ok) throw new Error(`HTTP ${res.status}`);
                            mdText = await res.text();
                        }
                        loader.style.display = "none";
                        mdBody.style.display = "block";
                        mdBody.innerHTML = `
        <div class="article-date-stamp">✦ ${art.date || "NO DATE"} &nbsp;|&nbsp; ${(art.tags || []).join(" · ")}</div>
        ${marked.parse(mdText)}`;
                    }
                } catch (e) {
                    loader.style.display = "none";
                    mdBody.style.display = "block";
                    mdBody.innerHTML = `
      <div class="article-date-stamp">✦ ERROR</div>
      <h1 style="color:var(--cyan)">⚠ โหลดไม่ได้</h1>
      <p>ไม่สามารถโหลดไฟล์ <code>${art.file}</code> ได้</p>
      <pre>${e.message}</pre>`;
                }

                document.getElementById("content-scroll").scrollTo(0, 0);
            }

            function selectArticleById(id) {
                if (id) loadArticle(id);
            }

            // ── Search ───────────────────────────────────────────────────
            function filterArticles(q) {
                q = q.toLowerCase().trim();
                filteredArticles = q
                    ? ARTICLES.filter(
                          (a) =>
                              a.title.toLowerCase().includes(q) ||
                              (a.tags || []).some((t) => t.includes(q)),
                      )
                    : [...ARTICLES];
                buildList(filteredArticles);
            }

            // ── Add guide ────────────────────────────────────────────────
            function showAddGuide() {
                loadArticle("demo");
            }

            // ── Mobile sidebar ───────────────────────────────────────────
            function toggleSidebar() {
                const sb = document.getElementById("sidebar");
                sb.style.display =
                    sb.style.display === "flex" ? "none" : "flex";
            }

            // ── Clock ────────────────────────────────────────────────────
            function updateClock() {
                const now = new Date();
                const pad = (n) => String(n).padStart(2, "0");
                document.getElementById("clock").textContent =
                    `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            }
            updateClock();
            setInterval(updateClock, 1000);

            // ── Starfield ────────────────────────────────────────────────
            (function () {
                const canvas = document.getElementById("starfield");
                const ctx = canvas.getContext("2d");
                let W,
                    H,
                    stars = [];

                function resize() {
                    W = canvas.width = window.innerWidth;
                    H = canvas.height = window.innerHeight;
                }

                function initStars() {
                    stars = [];
                    const count = Math.floor((W * H) / 4000);
                    for (let i = 0; i < count; i++) {
                        stars.push({
                            x: Math.random() * W,
                            y: Math.random() * H,
                            r: Math.random() * 1.2 + 0.2,
                            a: Math.random(),
                            da: (Math.random() - 0.5) * 0.003,
                            speed: Math.random() * 0.05,
                        });
                    }
                }

                // Occasional blue shooting star
                let shooters = [];
                function spawnShooter() {
                    if (Math.random() < 0.015) {
                        shooters.push({
                            x: Math.random() * W,
                            y: Math.random() * H * 0.5,
                            vx: 3 + Math.random() * 4,
                            vy: 1 + Math.random() * 2,
                            len: 80 + Math.random() * 60,
                            life: 1,
                        });
                    }
                }

                function draw() {
                    ctx.clearRect(0, 0, W, H);

                    stars.forEach((s) => {
                        s.a += s.da;
                        if (s.a > 1) s.da = -Math.abs(s.da);
                        if (s.a < 0) s.da = Math.abs(s.da);
                        s.y -= s.speed;
                        if (s.y < 0) {
                            s.y = H;
                            s.x = Math.random() * W;
                        }

                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${s.r > 1 ? "79,195,247" : "255,255,255"},${s.a * 0.7})`;
                        ctx.fill();
                    });

                    spawnShooter();
                    shooters = shooters.filter((s) => s.life > 0);
                    shooters.forEach((s) => {
                        s.x += s.vx;
                        s.y += s.vy;
                        s.life -= 0.025;
                        const grad = ctx.createLinearGradient(
                            s.x - (s.vx * s.len) / 4,
                            s.y - (s.vy * s.len) / 4,
                            s.x,
                            s.y,
                        );
                        grad.addColorStop(0, `rgba(0,229,255,0)`);
                        grad.addColorStop(1, `rgba(0,229,255,${s.life * 0.8})`);
                        ctx.beginPath();
                        ctx.moveTo(
                            s.x - (s.vx * s.len) / 4,
                            s.y - (s.vy * s.len) / 4,
                        );
                        ctx.lineTo(s.x, s.y);
                        ctx.strokeStyle = grad;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    });

                    requestAnimationFrame(draw);
                }

                window.addEventListener("resize", () => {
                    resize();
                    initStars();
                });
                resize();
                initStars();
                draw();
            })();

            // ── Init ─────────────────────────────────────────────────────
            (async function init() {
                try {
                    const res = await fetch("article/articles.json");
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    ARTICLES = await res.json();
                } catch (e) {
                    // fallback: แสดง error ใน content area
                    console.warn("articles.json โหลดไม่ได้:", e.message);
                    ARTICLES = [
                        {
                            id: "_error",
                            title: "⚠ โหลด articles.json ไม่ได้",
                            date: "",
                            tags: ["error"],
                            inline: `# ⚠ ไม่พบ articles.json\n\nตรวจสอบว่ามีไฟล์ \`article/articles.json\` ใน repo\n\n\`\`\`\n${e.message}\n\`\`\``,
                        },
                    ];
                }
                buildList(ARTICLES);
                // auto-load intro ถ้ามีอยู่ใน list
                const intro = ARTICLES.find((a) => a.id === "intro");
                if (intro) loadArticle("intro");
            })();
        </script>
    </body>
</html>
