<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
        }
        .todo-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
        }
        .todo-title {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .task-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .task-text {
            flex: 1;
            margin-right: 10px;
        }
        .task-done {
            text-decoration: line-through;
            color: #999;
        }
        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            color: #333;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
        }
    </style>
</head>
<body>
    <a href="index.html" class="btn-back">← กลับหน้าแรก</a>
    
    <div class="todo-card">
        <h2 class="todo-title">📝 To-Do List</h2>
        
        <div class="input-group">
            <input type="text" id="taskInput" class="form-control" placeholder="เพิ่มรายการใหม่..." onkeypress="handleEnter(event)">
            <button class="btn btn-success" onclick="addTask()">เพิ่ม</button>
        </div>
        
        <div id="taskList">
            <div class="empty-state">ยังไม่มีรายการ ลองเพิ่มสิ!</div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        function renderTasks() {
            const list = document.getElementById('taskList');
            
            if (tasks.length === 0) {
                list.innerHTML = '<div class="empty-state">ยังไม่มีรายการ ลองเพิ่มสิ!</div>';
                return;
            }
            
            list.innerHTML = tasks.map((task, index) => `
                <div class="task-item">
                    <span class="task-text ${task.done ? 'task-done' : ''}" onclick="toggleDone(${index})" style="cursor: pointer;">
                        ${task.done ? '✅' : '⭕'} ${task.text}
                    </span>
                    <button class="btn btn-danger btn-sm" onclick="deleteTask(${index})">ลบ</button>
                </div>
            `).join('');
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            
            if (text === '') {
                alert('กรุณาใส่รายการก่อน!');
                return;
            }
            
            tasks.push({ text: text, done: false });
            localStorage.setItem('tasks', JSON.stringify(tasks));
            input.value = '';
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function toggleDone(index) {
            tasks[index].done = !tasks[index].done;
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function handleEnter(event) {
            if (event.key === 'Enter') addTask();
        }

        renderTasks();
    </script>
</body>
</html>
