<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ท้องฟ้าจำลอง · Thai Sky Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --glass:rgba(9,15,32,.58);
  --stroke:rgba(150,190,255,.16);
  --stroke2:rgba(150,190,255,.28);
  --txt:#dde7ff;
  --dim:#8fa4cc;
  --dim2:#6b7fa6;
  --acc:#7fc4ff;
  --acc2:#a9d8ff;
  --gold:#ffd79a;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000205;
  font-family:'Noto Sans Thai','Inter',system-ui,sans-serif;color:var(--txt);}
canvas{display:block;touch-action:none}
#stage{position:fixed;inset:0}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,.35) 80%, rgba(0,0,0,.62) 100%);}
#ui{position:fixed;inset:0;z-index:5;pointer-events:none;transition:opacity .45s ease}
#ui.hidden{opacity:0;pointer-events:none!important}
#ui>*{pointer-events:auto}

.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  border:1px solid var(--stroke);border-radius:var(--r);
  box-shadow:0 8px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);}

#topbar{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;display:flex;gap:4px;padding:6px;align-items:center}
#topbar button{width:38px;height:38px;border:0;background:transparent;color:var(--dim);
  border-radius:11px;cursor:pointer;font-size:16px;display:grid;place-items:center;transition:.2s;font-family:inherit}
#topbar button:hover{background:rgba(127,196,255,.12);color:var(--acc2)}
#topbar button.on{background:rgba(127,196,255,.18);color:#fff}
#topbar .sep{width:1px;height:22px;background:var(--stroke);margin:0 3px}
#brand{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;padding:9px 15px;
  font-size:12.5px;letter-spacing:.3px;color:var(--dim);font-weight:500}
#brand b{color:var(--acc2);font-weight:600}
#brand span{opacity:.45;font-family:Inter,sans-serif;font-size:11px}

#panel{position:absolute;top:max(64px,calc(env(safe-area-inset-top) + 64px));left:14px;width:326px;
  max-height:calc(100vh - 170px);display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(-118%);opacity:0;transition:transform .42s cubic-bezier(.22,.9,.3,1),opacity .3s}
#panel.open{transform:none;opacity:1}
#panel header{padding:13px 13px 9px;border-bottom:1px solid var(--stroke)}
#q{width:100%;padding:10px 13px;border-radius:11px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.04);color:var(--txt);font-family:inherit;font-size:13.5px;outline:none}
#q:focus{border-color:var(--stroke2);background:rgba(127,196,255,.07)}
#q::placeholder{color:var(--dim2)}
.chips{display:flex;gap:6px;padding:10px 13px;flex-wrap:wrap;border-bottom:1px solid var(--stroke)}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--stroke);background:transparent;
  color:var(--dim);font-size:11.5px;cursor:pointer;font-family:inherit;transition:.2s}
.chip:hover{border-color:var(--stroke2);color:var(--acc2)}
.chip.on{background:rgba(127,196,255,.16);border-color:rgba(127,196,255,.4);color:#fff}
.chip.gold.on{background:rgba(255,215,154,.16);border-color:rgba(255,215,154,.42);color:#ffeccb}
#conList{overflow-y:auto;overscroll-behavior:contain;padding:6px 6px 12px;flex:1}
#conList::-webkit-scrollbar{width:7px}
#conList::-webkit-scrollbar-thumb{background:rgba(127,196,255,.2);border-radius:99px}
.row{padding:9px 11px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.18s}
.row:hover{background:rgba(127,196,255,.09)}
.row.sel{background:rgba(127,196,255,.16)}
.row.ast:hover{background:rgba(255,215,154,.10)}
.row.ast.sel{background:rgba(255,215,154,.16)}
.row .nm{flex:1;min-width:0}
.row .th{font-size:14px;font-weight:500;line-height:1.35}
.row.ast .th{color:#ffe7c4}
.row .en{font-size:10.5px;color:var(--dim2);font-family:Inter,sans-serif;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mo{font-size:10px;color:var(--acc);background:rgba(127,196,255,.11);
  padding:3px 7px;border-radius:7px;white-space:nowrap;border:1px solid rgba(127,196,255,.16)}
.row.ast .mo{color:var(--gold);background:rgba(255,215,154,.10);border-color:rgba(255,215,154,.16)}
.row .mo.off{color:var(--dim2);background:rgba(255,255,255,.03);border-color:transparent}
.sub{padding:2px 6px 10px 14px;display:none}
.sub.open{display:block}
.srow{padding:6px 10px;border-radius:9px;cursor:pointer;display:flex;gap:9px;align-items:baseline;transition:.15s}
.srow:hover{background:rgba(127,196,255,.09)}
.srow .by{font-family:Inter,serif;color:var(--acc);width:34px;font-size:12.5px;flex:none}
.srow .sn{font-size:12.5px;color:var(--txt);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .mg{font-size:10.5px;color:var(--dim2);font-family:Inter,sans-serif}
.head{padding:11px 13px 5px;font-size:10.5px;letter-spacing:1.4px;color:var(--dim2);text-transform:uppercase;font-family:Inter,sans-serif}
.empty{padding:26px 14px;text-align:center;color:var(--dim2);font-size:12.5px}

#monthbar{position:absolute;left:50%;transform:translateX(-50%);
  bottom:max(16px,calc(env(safe-area-inset-bottom) + 12px));
  display:flex;gap:2px;padding:6px;align-items:center;max-width:calc(100vw - 28px);overflow-x:auto;
  scrollbar-width:none}
#monthbar::-webkit-scrollbar{display:none}
#monthbar button{border:0;background:transparent;color:var(--dim);padding:8px 11px;border-radius:10px;
  font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.2s}
#monthbar button:hover{background:rgba(127,196,255,.11);color:var(--acc2)}
#monthbar button.on{background:rgba(127,196,255,.2);color:#fff;
  box-shadow:0 0 18px rgba(127,196,255,.25) inset}
#monthbar .free{color:var(--dim2);border-left:1px solid var(--stroke);margin-left:4px;padding-left:12px}

#settings{position:absolute;top:max(64px,calc(env(safe-area-inset-top) + 64px));left:14px;width:290px;padding:14px;
  display:none;max-height:calc(100vh - 170px);overflow-y:auto}
#settings.open{display:block}
#settings::-webkit-scrollbar{width:7px}
#settings::-webkit-scrollbar-thumb{background:rgba(127,196,255,.2);border-radius:99px}
.st{margin-bottom:13px}
.st label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:7px}
.st label b{color:var(--acc2);font-weight:500;font-family:Inter,sans-serif}
input[type=range]{width:100%;-webkit-appearance:none;height:3px;border-radius:9px;
  background:rgba(255,255,255,.13);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--acc);cursor:pointer;box-shadow:0 0 12px rgba(127,196,255,.7)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--acc)}
.tg{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:12.5px;color:var(--dim)}
.sw{width:38px;height:21px;border-radius:99px;background:rgba(255,255,255,.1);position:relative;
  cursor:pointer;transition:.25s;flex:none;border:1px solid var(--stroke)}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:var(--dim2);transition:.25s}
.sw.on{background:rgba(127,196,255,.3);border-color:rgba(127,196,255,.45)}
.sw.on::after{left:19px;background:#fff;box-shadow:0 0 10px rgba(127,196,255,.9)}
.divider{height:1px;background:var(--stroke);margin:12px 0 10px}

#card{position:absolute;right:14px;bottom:max(16px,calc(env(safe-area-inset-bottom) + 12px));
  width:300px;padding:17px 18px;transform:translateY(22px);opacity:0;pointer-events:none;transition:.36s cubic-bezier(.2,.9,.3,1)}
#card.open{transform:none;opacity:1;pointer-events:auto}
#card .kind{font-size:10px;letter-spacing:1.6px;color:var(--acc);text-transform:uppercase;font-family:Inter,sans-serif}
#card.g .kind{color:var(--gold)}
#card h2{margin:7px 0 2px;font-size:22px;font-weight:600;line-height:1.25}
#card .lat{font-family:Inter,sans-serif;font-size:13px;color:var(--dim);margin-bottom:13px;letter-spacing:.3px}
#card dl{margin:0 0 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
#card dt{color:var(--dim2)}
#card dd{margin:0;text-align:right;font-family:Inter,sans-serif;color:var(--txt)}
#card dd.th{font-family:'Noto Sans Thai',sans-serif}
#card .acts{display:flex;gap:8px}
#card a.btn{flex:1;text-align:center;padding:9px;border-radius:11px;text-decoration:none;
  font-size:12.5px;border:1px solid rgba(127,196,255,.3);background:rgba(127,196,255,.12);
  color:var(--acc2);cursor:pointer;font-family:inherit;transition:.2s}
#card a.btn:hover{background:rgba(127,196,255,.22);color:#fff}
#card .x{position:absolute;top:11px;right:11px;width:26px;height:26px;border:0;background:transparent;
  color:var(--dim2);cursor:pointer;border-radius:8px;font-size:15px}
#card .x:hover{background:rgba(255,255,255,.07);color:#fff}
#card .desc{font-size:12px;color:var(--dim);line-height:1.6;margin:-4px 0 13px}

#dirLayer,#lblLayer{position:fixed;inset:0;pointer-events:none;z-index:3}
.dir{position:absolute;transform:translate(-50%,-50%);font-family:Inter,sans-serif;font-size:13px;
  letter-spacing:3px;color:rgba(160,195,245,.5);text-shadow:0 0 14px rgba(0,0,0,.9)}
.dir.minor{font-size:10px;color:rgba(160,195,245,.26);letter-spacing:2px}
.clbl{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;
  text-shadow:0 0 16px rgba(0,0,0,.95);transition:opacity .5s}
.clbl .a{font-size:14px;color:rgba(200,225,255,.9);letter-spacing:.5px}
.clbl .b{font-size:9.5px;color:rgba(140,180,235,.6);letter-spacing:2.4px;font-family:Inter,sans-serif;text-transform:uppercase}
.clbl.gold .a{color:rgba(255,226,182,.92)}
.clbl.gold .b{color:rgba(228,190,140,.6)}
.slbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;
  text-shadow:0 0 12px rgba(0,0,0,.95);pointer-events:none}
.slbl .a{font-size:11px;color:rgba(198,220,255,.62);letter-spacing:.3px}
.slbl .b{font-size:8.5px;color:rgba(140,175,225,.42);letter-spacing:1.6px;font-family:Inter,sans-serif}
#reticle{position:absolute;width:46px;height:46px;transform:translate(-50%,-50%);pointer-events:none;
  opacity:0;transition:opacity .3s}
#reticle div{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(127,196,255,.55)}
#reticle div:nth-child(2){inset:7px;border-color:rgba(127,196,255,.2);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.22);opacity:.12}}
#tip{position:fixed;z-index:4;pointer-events:none;padding:5px 10px;border-radius:9px;font-size:12px;
  background:rgba(6,11,24,.86);border:1px solid var(--stroke);opacity:0;transition:opacity .18s;
  transform:translate(12px,-50%);backdrop-filter:blur(8px);white-space:nowrap}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:6;padding:9px 18px;border-radius:99px;
  font-size:12.5px;color:var(--dim);background:rgba(6,11,24,.7);border:1px solid var(--stroke);
  backdrop-filter:blur(12px);opacity:0;transition:opacity .6s;pointer-events:none}
#loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#000205;
  transition:opacity .8s;font-size:13px;color:var(--dim);letter-spacing:2px}

@media (max-width:860px){
  #brand{display:none}
  #panel{left:0;right:0;top:auto;bottom:0;width:100%;max-height:70vh;border-radius:22px 22px 0 0;
    transform:translateY(100%);border-bottom:0}
  #panel.open{transform:none}
  #panel header::before{content:'';display:block;width:40px;height:4px;border-radius:9px;
    background:rgba(255,255,255,.18);margin:-4px auto 11px}
  #monthbar{bottom:max(12px,calc(env(safe-area-inset-bottom) + 8px));border-radius:14px}
  #monthbar button{padding:8px 9px;font-size:12px}
  #card{left:10px;right:10px;width:auto;top:auto;
    bottom:max(74px,calc(env(safe-area-inset-bottom) + 68px));border-radius:20px}
  #settings{left:10px;right:10px;width:auto;max-height:64vh}
  #topbar{top:max(10px,env(safe-area-inset-top));left:10px}
  #tip{display:none}
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>
<div id="dirLayer"></div>
<div id="lblLayer"><div id="reticle"><div></div><div></div></div></div>
<div id="tip"></div>
<div id="toast"></div>

<div id="ui">
  <div id="topbar" class="glass">
    <button id="btnList" title="รายชื่อกลุ่มดาว (L)">☰</button>
    <button id="btnSettings" title="ตั้งค่า">⚙</button>
    <div class="sep"></div>
    <button id="btnPlay" title="หยุด/เล่นการหมุน (Space)">⏸</button>
    <button id="btnFull" title="เต็มจอ (F)">⛶</button>
    <button id="btnHide" title="ซ่อนหน้าจอควบคุม (H)">👁</button>
  </div>
  <div id="brand" class="glass"><b>ท้องฟ้าจำลอง</b> <span>THAI SKY ATLAS</span></div>

  <aside id="panel" class="glass">
    <header><input id="q" placeholder="ค้นหากลุ่มดาว หรือชื่อดาว…" autocomplete="off"></header>
    <div class="chips" id="chips"></div>
    <div id="conList"></div>
  </aside>

  <div id="settings" class="glass">
    <div class="st"><label>ความเร็วการหมุนท้องฟ้า <b id="vSpeed">40×</b></label><input type="range" id="rSpeed" min="0" max="300" value="40"></div>
    <div class="st"><label>ความเข้มทางช้างเผือก <b id="vMw">0.70</b></label><input type="range" id="rMw" min="0" max="150" value="70"></div>
    <div class="st"><label>แสงเรืองรอบดาว <b id="vBloom">0.95</b></label><input type="range" id="rBloom" min="0" max="180" value="95"></div>
    <div class="st"><label>ความสว่างดาว <b id="vBright">1.00</b></label><input type="range" id="rBright" min="40" max="190" value="100"></div>
    <div class="st"><label>ขนาดดาว <b id="vSize">1.00</b></label><input type="range" id="rSize" min="55" max="175" value="100"></div>
    <div class="st"><label>ความหนาแน่นดาวพื้นหลัง <b id="vHaze">1.00</b></label><input type="range" id="rHaze" min="0" max="180" value="100"></div>
    <div class="divider"></div>
    <div class="tg"><span>ทางช้างเผือก</span><div class="sw on" id="swMw"></div></div>
    <div class="tg"><span>ป้ายชื่อดาวสว่าง</span><div class="sw" id="swLbl"></div></div>
    <div class="tg"><span>เส้นกลุ่มดาวสมมติ (สีทอง)</span><div class="sw on" id="swAst"></div></div>
    <div class="tg"><span>หรี่ดาวใต้ขอบฟ้า</span><div class="sw on" id="swHz"></div></div>
    <div class="tg"><span>ป้ายทิศ N / E / S / W</span><div class="sw on" id="swDir"></div></div>
    <div class="tg"><span>แสดงเส้นกลุ่มดาวทั้งหมด</span><div class="sw" id="swAll"></div></div>
    <div class="tg"><span>โหมดโชว์ (ไฮไลต์สลับกัน)</span><div class="sw on" id="swShow"></div></div>
  </div>

  <div id="monthbar" class="glass"></div>

  <div id="card" class="glass">
    <button class="x" id="cardX">✕</button>
    <div class="kind" id="cKind"></div>
    <h2 id="cName"></h2>
    <div class="lat" id="cLat"></div>
    <div class="desc" id="cDesc"></div>
    <dl id="cMeta"></dl>
    <div class="acts"><a class="btn" id="cWiki" target="_blank" rel="noopener">เปิดวิกิพีเดีย ↗</a></div>
  </div>
</div>

<div id="loader">กำลังจุดดวงดาว…</div>

}}
</script>

const LAT = 18.5735, LON = 98.4822;
const D2R = Math.PI/180, H2R = Math.PI/12;
const GREEK = {'α':'Alpha','β':'Beta','γ':'Gamma','δ':'Delta','ε':'Epsilon','ζ':'Zeta','η':'Eta','θ':'Theta','ι':'Iota','κ':'Kappa','λ':'Lambda','μ':'Mu','ν':'Nu','ξ':'Xi','ο':'Omicron','π':'Pi','ρ':'Rho','σ':'Sigma','τ':'Tau','υ':'Upsilon','φ':'Phi','χ':'Chi','ψ':'Psi','ω':'Omega'};
const SPEC = {O:[0.60,0.70,1.00],B:[0.70,0.80,1.00],A:[0.84,0.89,1.00],F:[0.99,0.98,1.00],G:[1.00,0.95,0.86],K:[1.00,0.82,0.62],M:[1.00,0.68,0.47]};
const MTH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const MTHFULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

function sphere(ra,dec,r){const c=Math.cos(dec*D2R);return new THREE.Vector3(c*Math.cos(ra*H2R)*r,c*Math.sin(ra*H2R)*r,Math.sin(dec*D2R)*r);}

const STARS=[], BY={}, BYCON={};
RAW.trim().split('\n').forEach(line=>{
  const p=line.split('|'); if(p.length<7) return;
  const s={con:p[0],bayer:p[1],name:p[2]||'',ra:+p[3],dec:+p[4],mag:+p[5],spec:p[6],th:(p[7]||'').trim()};
  s.key=s.con+'.'+s.bayer;
  s.dir=sphere(s.ra,s.dec,1);
  STARS.push(s); BY[s.key]=s;
  (BYCON[s.con]=BYCON[s.con]||[]).push(s);
});
for(const k in BYCON) BYCON[k].sort((a,b)=>a.mag-b.mag);

function wikiStar(s){
  if(s.name) return s.name.replace(/ /g,'_');
  const g=GREEK[s.bayer.replace(/[0-9]/g,'')];
  const gen=(CONS[s.con]?CONS[s.con].gen:'').replace(/ /g,'_');
  return (g?g:s.bayer)+'_'+gen;
}

function gmst(d){let jd=d.getTime()/86400000+2440587.5,t=jd-2451545.0,g=(18.697374558+24.06570982441908*t)%24;return g<0?g+24:g;}
function lstAt(d){let v=(gmst(d)+LON/15)%24;return v<0?v+24:v;}
const RA_CULM=[];
for(let m=0;m<12;m++) RA_CULM.push(lstAt(new Date(Date.UTC(2025,m,15,14,0,0))));
function hdiff(a,b){let d=Math.abs(a-b)%24;return d>12?24-d:d;}

function visInfo(ctr){
  let ra=Math.atan2(ctr.y,ctr.x)/H2R; if(ra<0)ra+=24;
  const dec=Math.asin(THREE.MathUtils.clamp(ctr.z,-1,1))/D2R;
  const maxAlt=90-Math.abs(LAT-dec);
  const months=[]; for(let m=0;m<12;m++) if(hdiff(ra,RA_CULM[m])<3.1 && maxAlt>12) months.push(m);
  return {ra,dec,maxAlt,months};
}
function monthText(c){
  if(!c.months.length) return c.maxAlt>12?'เห็นได้บางช่วง':'เห็นยากจากไทย';
  const m=c.months;let a=m[0],b=m[m.length-1];
  if(m.length>1&&m[0]===0&&m[m.length-1]===11){let i=0;while(i<m.length-1&&m[i+1]===m[i]+1)i++;a=m[i+1];b=m[i];}
  return MTH[a]+'–'+MTH[b];
}

const CLIST=[];
for(const ab in CONS){
  const c=CONS[ab], st=BYCON[ab]||[]; if(!st.length) continue;
  const ctr=new THREE.Vector3();
  st.forEach(s=>ctr.add(s.dir)); ctr.normalize();
  let rad=0; st.forEach(s=>rad=Math.max(rad,ctr.angleTo(s.dir)));
  const v=visInfo(ctr);
  const bright=st.reduce((a,s)=>a+Math.pow(2.512,-s.mag),0);
  CLIST.push(Object.assign({ab,ctr,rad,bright,stars:st,isAst:false},v,c));
}
CLIST.sort((a,b)=>a.th.localeCompare(b.th,'th'));
const CMAP={}; CLIST.forEach(c=>CMAP[c.ab]=c);

const FEAT=[];
for(let m=0;m<12;m++){
  FEAT.push(CLIST.filter(c=>c.months.includes(m)&&c.maxAlt>22)
    .sort((a,b)=>b.bright-a.bright).slice(0,7).map(c=>c.ab));
}

/* --- แปลง asterism --- */
const ALIST=[];
ASTER.forEach(a=>{
  const segs=[],set=new Set();
  a.l.split(/\s+/).forEach(seg=>{
    const [x,y]=seg.split('-');
    const A=BY[x],B=BY[y]; if(!A||!B)return;
    segs.push([A,B]); set.add(A); set.add(B);
  });
  if(!segs.length) return;
  const stars=[...set].sort((p,q)=>p.mag-q.mag);
  const ctr=new THREE.Vector3(); stars.forEach(s=>ctr.add(s.dir)); ctr.normalize();
  let rad=0; stars.forEach(s=>rad=Math.max(rad,ctr.angleTo(s.dir)));
  ALIST.push(Object.assign({ctr,rad,segs,stars,isAst:true},visInfo(ctr),a));
});

/* --- ทางช้างเผือก (ปรับใหม่: จางลง คอนทราสต์สูงขึ้น) --- */
const mwMat=new THREE.ShaderMaterial({
  side:THREE.BackSide,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uO:{value:0.70}},
  vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vP;uniform float uO;
   float hash(vec3 p){p=fract(p*0.3183099+vec3(.1,.2,.3));p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
   float noise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
     return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
   float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*noise(p);p*=2.03;a*=.5;}return s;}
   void main(){
    vec3 d=normalize(vP);
    vec3 GP=vec3(-0.867666,-0.198076,0.455984);
    vec3 GC=vec3(-0.054876,-0.873437,-0.483835);
    float b=dot(d,GP), lc=dot(d,GC);
    float band=exp(-pow(abs(b)/0.135,1.9));
    float cb=0.32+1.05*smoothstep(-0.30,1.0,lc);
    float n=fbm(d*6.5), n2=fbm(d*16.0+3.1);
    float rift=smoothstep(0.30,0.74,fbm(d*9.0+11.0));
    float inten=band*cb*(0.32+0.92*n)*(0.45+0.70*n2);
    inten*=mix(1.0,0.18,rift*band);
    inten=pow(clamp(inten,0.,1.),1.55);

const GAL_T=[[-0.054876,0.494109,-0.867666],[-0.873437,-0.444830,-0.198076],[-0.483835,0.746982,0.455984]];
function galToEq(l,b){
  const g=[Math.cos(b)*Math.cos(l),Math.cos(b)*Math.sin(l),Math.sin(b)];
  return new THREE.Vector3(
    GAL_T[0][0]*g[0]+GAL_T[0][1]*g[1]+GAL_T[0][2]*g[2],
    GAL_T[1][0]*g[0]+GAL_T[1][1]*g[1]+GAL_T[1][2]*g[2],
    GAL_T[2][0]*g[0]+GAL_T[2][1]*g[1]+GAL_T[2][2]*g[2]);
}
const starVS=`
attribute float aSize; attribute vec3 aColor; attribute float aPhase;
attribute float aTwk; attribute float aSpike;
uniform float uTime,uScale,uSizeMul,uHorizon,uBright;
varying vec3 vC; varying float vS; varying float vA;
void main(){
  vec4 wp=modelMatrix*vec4(position,1.);
  vec4 mv=viewMatrix*wp;
  float alt=normalize(wp.xyz).y;
  float hz=mix(1.0, smoothstep(-0.34,0.03,alt)*0.94+0.06, uHorizon);
  float low=clamp(1.0-(alt+0.08)*1.7,0.0,1.0);
  float tw=1.0+aTwk*(0.42+0.58*low)*(sin(uTime*2.1+aPhase)*0.6+sin(uTime*3.73+aPhase*1.7)*0.4);
  tw=max(tw,0.28);
  gl_Position=projectionMatrix*mv;
  gl_PointSize=aSize*uSizeMul*tw*uScale/max(-mv.z,1.0);
  vC=aColor; vS=aSpike; vA=hz*uBright*clamp(tw,0.3,1.7);
}`;
const starFS=`
varying vec3 vC; varying float vS; varying float vA;
void main(){
  vec2 p=gl_PointCoord-0.5; float d=length(p)*2.0;
  if(d>1.0) discard;
  float core=pow(max(0.,1.-d),6.0);
  float halo=pow(max(0.,1.-d),1.6)*0.30;
  float sp=0.0;
  if(vS>0.01){
    sp=(exp(-abs(p.x)*44.0)*exp(-abs(p.y)*5.0)+exp(-abs(p.y)*44.0)*exp(-abs(p.x)*5.0))*vS*0.55;
    sp*=smoothstep(1.0,0.15,d);
  }
  float a=(core+halo+sp)*vA;
  gl_FragColor=vec4(vC,clamp(a,0.,1.));
}`;
function buildPoints(list,radius){
  const n=list.length,g=new THREE.BufferGeometry();
  const pos=new Float32Array(n*3),col=new Float32Array(n*3),sz=new Float32Array(n),
        ph=new Float32Array(n),tw=new Float32Array(n),sp=new Float32Array(n);
  list.forEach((s,i)=>{
    pos[i*3]=s.dir.x*radius; pos[i*3+1]=s.dir.y*radius; pos[i*3+2]=s.dir.z*radius;
    const c=SPEC[s.spec]||SPEC.A;
    col[i*3]=c[0];col[i*3+1]=c[1];col[i*3+2]=c[2];
    sz[i]=s.size; ph[i]=Math.random()*100; tw[i]=s.twk; sp[i]=s.spike;
  });
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  g.setAttribute('aSize',new THREE.BufferAttribute(sz,1));
  g.setAttribute('aPhase',new THREE.BufferAttribute(ph,1));
  g.setAttribute('aTwk',new THREE.BufferAttribute(tw,1));
  g.setAttribute('aSpike',new THREE.BufferAttribute(sp,1));
  const m=new THREE.ShaderMaterial({uniforms:{uTime:{value:0},uScale:{value:800},uSizeMul:{value:1},
    uHorizon:{value:1},uBright:{value:1}},vertexShader:starVS,fragmentShader:starFS,
    transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending});
  const p=new THREE.Points(g,m); p.frustumCulled=false; return p;
}

function aimAt(v){

const el=renderer.domElement;
const isTouch=matchMedia('(pointer:coarse)').matches;
let ptrs=new Map(),pinch0=0,fov0=0;
el.addEventListener('pointerdown',e=>{
  el.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){S.drag=true;S.px=e.clientX;S.py=e.clientY;S.moved=0;S.vy=S.vp=0;S.follow=null;}
  if(ptrs.size===2){const a=[...ptrs.values()];pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);fov0=S.fov;}
});
el.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinch0>0) S.fov=THREE.MathUtils.clamp(fov0*pinch0/d,12,96);
    return;
  }
  if(S.drag){
    const k=S.fov*D2R/innerHeight*1.25;
    const dx=e.clientX-S.px,dy=e.clientY-S.py;
    S.moved+=Math.abs(dx)+Math.abs(dy);
    S.yaw+=dx*k; S.pitch=THREE.MathUtils.clamp(S.pitch+dy*k,-1.53,1.53);
    S.vy=dx*k; S.vp=dy*k;
    S.px=e.clientX;S.py=e.clientY;
  } else if(!isTouch){ updateHover(e.clientX,e.clientY); }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch0=0;
  if(ptrs.size===0){
    if(S.drag&&S.moved<7) handleTap(e.clientX,e.clientY);
    S.drag=false;
  }
}

const ray=new THREE.Raycaster(),nd=new THREE.Vector2();
function localDirFrom(x,y){
  nd.x=(x/innerWidth)*2-1; nd.y=-(y/innerHeight)*2+1;
  ray.setFromCamera(nd,camera);
  const w=ray.ray.direction.clone().normalize();
  const inv=new THREE.Matrix4().copy(skyRot.matrixWorld).invert();
  return w.applyMatrix4(new THREE.Matrix4().extractRotation(inv)).normalize();
}
function nearestStar(ld,maxDeg){
  let best=null,bd=Math.cos(maxDeg*D2R);
  for(const s of STARS){const d=s.dir.dot(ld); if(d>bd){bd=d;best=s;}}
  for(const o of DSO){const d=o.dir.dot(ld); if(d>bd){bd=d;best=o;}}
  return best;
}
function conAt(ld){
  let best=null,bs=1e9;
  for(const c of CLIST){
    const a=Math.acos(THREE.MathUtils.clamp(c.ctr.dot(ld),-1,1));
    const lim=c.rad*0.92+5*D2R;
    if(a<lim){const sc=a/lim; if(sc<bs){bs=sc;best=c;}}
  }
  return best;
}
const tip=document.getElementById('tip');
function updateHover(x,y){
  const ld=localDirFrom(x,y);
  const st=nearestStar(ld,(S.fov/innerHeight)*22);
  if(st&&!S.sel){
    tip.style.opacity=1; tip.style.left=x+'px'; tip.style.top=y+'px';
    tip.textContent=st.th?st.th+(st.name?' · '+st.name:''):(st.name||st.n||st.bayer);

function handleTap(x,y){
  const ld=localDirFrom(x,y);
  const st=nearestStar(ld,(S.fov/innerHeight)*26);

  const c=conAt(ld);

  $('cWiki').href='https://en.wikipedia.org/wiki/'+c.w;
  card.classList.add('open');
  focusOn(c.ctr, THREE.MathUtils.clamp(c.rad/D2R*2.6,26,78));
  if(!fromList) conList.querySelectorAll('.row.sel').forEach(x=>x.classList.remove('sel'));
}
function selectAst(a){
  S.sel={con:a,dir:a.ctr,ast:true};
  CLIST.forEach(x=>x.target=0); ALIST.forEach(x=>x.target=0); a.target=1;
  card.classList.add('g');
  $('cKind').textContent='กลุ่มดาวสมมติ · Asterism';
  $('cName').textContent=a.th;
  $('cLat').textContent=a.en;
  $('cDesc').textContent=a.d||'';
  $('cMeta').innerHTML='';
  addMeta('มองเห็นดีที่สุด',monthText(a),true);
  addMeta('ดาวประกอบ',a.stars.length+' ดวง',true);
  addMeta('ดาวสว่างสุด',(a.stars[0].th||a.stars[0].name),true);
  addMeta('ขนาดเชิงมุม','≈ '+(a.rad*2/D2R).toFixed(0)+'°');
  $('cWiki').href='https://en.wikipedia.org/wiki/'+a.w;
  card.classList.add('open');
  focusOn(a.ctr, THREE.MathUtils.clamp(a.rad/D2R*2.5,30,86));
}
function fmtRA(h){const H=Math.floor(h),m=Math.floor((h-H)*60),s=Math.round((((h-H)*60)-m)*60);return `${H}ʰ ${String(m).padStart(2,'0')}ᵐ ${String(s).padStart(2,'0')}ˢ`;}
function fmtDec(d){const sg=d<0?'−':'+';d=Math.abs(d);const D=Math.floor(d),m=Math.round((d-D)*60);return `${sg}${D}° ${String(m).padStart(2,'0')}′`;}

let followTween=null;
function focusOn(localDir,fov){
  const wv=localDir.clone().applyMatrix4(new THREE.Matrix4().extractRotation(skyRot.matrixWorld));
  const a=aimAt(wv);
  let dy=a.yaw-S.yaw; while(dy>Math.PI)dy-=Math.PI*2; while(dy<-Math.PI)dy+=Math.PI*2;
  followTween={y0:S.yaw,y1:S.yaw+dy,p0:S.pitch,p1:a.pitch,f0:S.fov,f1:fov,t:0,dur:1.25};
  S.follow=localDir.clone();
  if(innerWidth<860) panel.classList.remove('open');
}

$('btnList').onclick=()=>{panel.classList.toggle('open');settings.classList.remove('open');
  $('btnList').classList.toggle('on',panel.classList.contains('open'));$('btnSettings').classList.remove('on');};
$('btnSettings').onclick=()=>{settings.classList.toggle('open');panel.classList.remove('open');
  $('btnSettings').classList.toggle('on',settings.classList.contains('open'));$('btnList').classList.remove('on');};
$('btnPlay').onclick=()=>{S.playing=!S.playing;$('btnPlay').textContent=S.playing?'⏸':'▶';};
$('btnFull').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();};
$('btnHide').onclick=toggleUI;
function toggleUI(){S.uiHidden=!S.uiHidden;$('ui').classList.toggle('hidden',S.uiHidden);
  if(S.uiHidden)toast('แตะที่ว่างหรือกด H เพื่อแสดงเมนูอีกครั้ง');}
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(k==='h')toggleUI();
  if(k==='l')$('btnList').click();
  if(k==='f')$('btnFull').click();
  if(k===' '){e.preventDefault();$('btnPlay').click();}
  if(k==='escape')clearSel();
});
el.addEventListener('dblclick',()=>{if(S.uiHidden)toggleUI();});

function bind(id,vid,fn,fmt){const r=$(id);r.addEventListener('input',()=>{const v=+r.value;$(vid).textContent=fmt(v);fn(v);});}
bind('rSpeed','vSpeed',v=>S.speed=v,v=>v===0?'หยุด':v+'×');
bind('rMw','vMw',v=>mwMat.uniforms.uO.value=v/100,v=>(v/100).toFixed(2));
bind('rBloom','vBloom',v=>bloom.strength=v/100,v=>(v/100).toFixed(2));
bind('rBright','vBright',v=>mainMat.uniforms.uBright.value=v/100,v=>(v/100).toFixed(2));
bind('rSize','vSize',v=>{mainMat.uniforms.uSizeMul.value=v/100;hazeLayers.forEach(p=>p.material.uniforms.uSizeMul.value=v/100);},v=>(v/100).toFixed(2));
bind('rHaze','vHaze',v=>hazeLayers.forEach(p=>p.material.uniforms.uBright.value=p.userData.base*v/100),v=>(v/100).toFixed(2));
function sw(id,init,fn){const e=$(id);let on=init;e.classList.toggle('on',on);e.onclick=()=>{on=!on;e.classList.toggle('on',on);fn(on);};}
sw('swMw',true,v=>mw.visible=v);
sw('swLbl',false,v=>{S.showLbl=v;if(!v)starLbls.forEach(l=>l.el.style.display='none');});
sw('swAst',true,v=>{S.showAst=v;astGroup.visible=v;});
sw('swHz',true,v=>{mainMat.uniforms.uHorizon.value=v?1:0;hazeLayers.forEach(p=>p.material.uniforms.uHorizon.value=v?1:0);});
sw('swDir',true,v=>dirLayer.style.display=v?'':'none');
sw('swAll',false,v=>S.allLines=v);
sw('swShow',true,v=>{S.showcase=v;S.showT=0;});

let toastT;
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>e.style.opacity=0,2600);}

/* --- ป้าย --- */
const dirLayer=$('dirLayer'),lblLayer=$('lblLayer'),reticle=$('reticle');
const DIRS=[['N',0,1],['NE',45,0],['E',90,1],['SE',135,0],['S',180,1],['SW',225,0],['W',270,1],['NW',315,0]];
const dirEls=DIRS.map(([t,az,maj])=>{
  const d=document.createElement('div');d.className='dir'+(maj?'':' minor');d.textContent=t;
  dirLayer.appendChild(d);
  const a=az*D2R;
  return {el:d,v:new THREE.Vector3(Math.sin(a),0,-Math.cos(a))};
});
const conLbls=new Map();
function conLabel(c,gold){
  if(conLbls.has(c.ab))return conLbls.get(c.ab);
  const d=document.createElement('div');d.className='clbl'+(gold?' gold':'');
  d.innerHTML=`<div class="a">${c.th}</div><div class="b">${gold?c.en:c.ab}</div>`;
  lblLayer.appendChild(d);conLbls.set(c.ab,d);return d;
}
// ป้ายชื่อดาวสว่าง
const BRIGHT=STARS.filter(s=>s.mag<=1.5&&(s.th||s.name)).sort((a,b)=>a.mag-b.mag).slice(0,20);
const starLbls=BRIGHT.map(s=>{
  const d=document.createElement('div');d.className='slbl';d.style.display='none';
  d.innerHTML=`<div class="a">${(s.th||s.name).split(' (')[0]}</div><div class="b">${s.name||''}</div>`;
  lblLayer.appendChild(d);
  return {el:d,s};
});

const projV=new THREE.Vector3();
function project(v3){
  projV.copy(v3).project(camera);
  return {x:(projV.x*0.5+0.5)*innerWidth,y:(-projV.y*0.5+0.5)*innerHeight,vis:projV.z<1};
}

/* ============================================================
   6. ลูป
   ============================================================ */
const clock=new THREE.Clock();
let t0=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05); t0+=dt;

  if(lstTween){
    lstTween.t+=dt; const k=Math.min(1,lstTween.t/lstTween.dur);
    const e=k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    S.lst=lstTween.from+(lstTween.to-lstTween.from)*e;
    if(k>=1)lstTween=null;
  } else if(S.playing){
    S.lst+=dt*(2*Math.PI/86164)*S.speed;
  }
  skyRot.rotation.z=-S.lst;
  skyRot.updateMatrixWorld(true);

  if(!S.drag&&!followTween){
    S.yaw+=S.vy; S.pitch=THREE.MathUtils.clamp(S.pitch+S.vp,-1.53,1.53);
    S.vy*=0.92; S.vp*=0.92;
    if(Math.abs(S.vy)<1e-5)S.vy=0; if(Math.abs(S.vp)<1e-5)S.vp=0;
  }
  if(followTween){
    followTween.t+=dt;const k=Math.min(1,followTween.t/followTween.dur);
    const e=1-Math.pow(1-k,3);
    S.yaw=followTween.y0+(followTween.y1-followTween.y0)*e;
    S.pitch=followTween.p0+(followTween.p1-followTween.p0)*e;
    S.fov=followTween.f0+(followTween.f1-followTween.f0)*e;
    if(k>=1)followTween=null;
  } else if(S.follow&&!S.drag){
    const wv=S.follow.clone().applyMatrix4(new THREE.Matrix4().extractRotation(skyRot.matrixWorld));
    const a=aimAt(wv);
    let dy=a.yaw-S.yaw; while(dy>Math.PI)dy-=Math.PI*2; while(dy<-Math.PI)dy+=Math.PI*2;
    S.yaw+=dy*0.06; S.pitch+=(a.pitch-S.pitch)*0.06;
  }

  camera.fov=S.fov; camera.updateProjectionMatrix();
  camera.rotation.set(S.pitch,S.yaw,0,'YXZ');

  S.lagX+=(-S.vy*380-S.lagX)*0.06; S.lagY+=(S.vp*380-S.lagY)*0.06;
  const dx=9.5*Math.sin(t0*0.071)+THREE.MathUtils.clamp(S.lagX,-14,14);
  const dy=6.5*Math.cos(t0*0.053)+THREE.MathUtils.clamp(S.lagY,-10,10);
  const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
  const up=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
  camera.position.copy(right.multiplyScalar(dx)).add(up.multiplyScalar(dy));

  if(S.showcase&&!S.sel){
    S.showT+=dt;
    const feat=S.month!==null?FEAT[S.month]:FEAT[new Date().getMonth()];
    if(feat.length){
      if(S.showT>8){S.showT=0;S.showIdx=(S.showIdx+1)%feat.length;}
      const active=feat[S.showIdx];
      CLIST.forEach(c=>c.target=(c.ab===active)?0.85:(S.allLines?0.16:0));
    }
  } else if(!S.sel){
    CLIST.forEach(c=>c.target=S.allLines?0.16:0);
  }
  if(!S.sel) ALIST.forEach(a=>a.target=0);
  if(S.hover&&!S.sel&&!isTouch) S.hover.target=Math.max(S.hover.target,0.72);
  if(S.sel&&S.sel.con) S.sel.con.target=1;

  const upd=(c,gold,mul)=>{
    c.cur+=(c.target-c.cur)*Math.min(1,dt*5);
    c.mesh.material.opacity=c.cur*mul;
    c.mesh.visible=c.cur>0.01;
    const lb=conLbls.get(c.ab);
    if(c.cur>0.12){
      const e2=conLabel(c,gold);
      const p=project(c.ctr.clone().multiplyScalar(600).applyMatrix4(skyRot.matrixWorld));
      if(p.vis){e2.style.display='';e2.style.left=p.x+'px';e2.style.top=p.y+'px';e2.style.opacity=Math.min(1,(c.cur-0.12)*1.6);}
      else e2.style.display='none';
    } else if(lb) lb.style.display='none';
  };
  CLIST.forEach(c=>upd(c,false,0.75));
  ALIST.forEach(a=>upd(a,true,0.62));

  dirEls.forEach(d=>{
    const p=project(d.v.clone().multiplyScalar(900));
    if(p.vis){d.el.style.display='';d.el.style.left=p.x+'px';d.el.style.top=p.y+'px';}
    else d.el.style.display='none';
  });

  if(S.showLbl){
    starLbls.forEach(l=>{
      const p=project(l.s.dir.clone().multiplyScalar(600).applyMatrix4(skyRot.matrixWorld));
      if(p.vis){l.el.style.display='';l.el.style.left=p.x+'px';l.el.style.top=(p.y+18)+'px';}
      else l.el.style.display='none';
    });
  }

  if(S.sel&&S.sel.star){
    const p=project(S.sel.star.dir.clone().multiplyScalar(600).applyMatrix4(skyRot.matrixWorld));
    if(p.vis){reticle.style.opacity=1;reticle.style.left=p.x+'px';reticle.style.top=p.y+'px';}
    else reticle.style.opacity=0;
  }

  const sc=renderer.domElement.height/(2*Math.tan(S.fov*D2R/2));
  mainMat.uniforms.uTime.value=t0; mainMat.uniforms.uScale.value=sc;
  hazeLayers.forEach(p=>{p.material.uniforms.uTime.value=t0;p.material.uniforms.uScale.value=sc;});
  DSO.forEach(o=>{o.mesh.material.opacity=0.40+0.12*Math.sin(t0*0.55+o.ra);});

  composer.render();
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
  bloom.resolution.set(innerWidth,innerHeight);
});

paintMonth();
animate();
setTimeout(()=>{const l=$('loader');l.style.opacity=0;setTimeout(()=>l.remove(),900);},450);
setTimeout(()=>toast(isTouch?'ลากเพื่อมองรอบทิศ · แตะดาวเพื่อดูข้อมูล':'ลากเมาส์เพื่อมอง · เลื่อนล้อเพื่อซูม · คลิกดาวเพื่อดูข้อมูล'),1100);
</script>
